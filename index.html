/* ---- src/bolum/gunum.js ---- */
/* ===== Günümü hazırla — bütün günü tek ekranda toplayan sayfa (#/gunum, menüde yok) =====
   Kendi verisi yok; Planım, Hatırlatmalar, mutfak, giyim ve "ne yapsam" bölümlerinden okur.
   Diğer bölümlerin işlevleri henüz yoksa ilgili kart görünmez. */
const GN_RENK='#14213D';
/* diğer bölümlerin işlevleri: yoksa undefined döner (typeof ile; const ile tanımlananlar da görünür) */
const gnDene=f=>{try{return f()}catch(e){console.error(e);return undefined}};
const GN_DIS={
 mtGununMenusu:()=>typeof mtGununMenusu==='function'?gnDene(()=>mtGununMenusu()):undefined,
 mtTarifBul:id=>typeof mtTarifBul==='function'?gnDene(()=>mtTarifBul(id)):undefined,
 gyGununKombini:()=>typeof gyGununKombini==='function'?gnDene(()=>gyGununKombini()):undefined,
 ypGununOnerileri:(n,k)=>typeof ypGununOnerileri==='function'?gnDene(()=>ypGununOnerileri(n,k)):undefined,
 ypSiradakiIsler:n=>typeof ypSiradakiIsler==='function'?gnDene(()=>ypSiradakiIsler(n)):undefined,
 plBugunIsler:()=>typeof plBugunIsler==='function'?gnDene(()=>plBugunIsler()):undefined,
 plGunOgeleri:(d,o)=>typeof plGunOgeleri==='function'?gnDene(()=>plGunOgeleri(d,o)):undefined,
 plAkis:(L,o)=>typeof plAkis==='function'?gnDene(()=>plAkis(L,o)):undefined,
 plSat:(x,o)=>typeof plSat==='function'?gnDene(()=>plSat(x,o)):undefined,
 plGorevPencere:()=>typeof plGorevPencere==='function'?true:undefined,
 htYaklasan:n=>typeof htYaklasan==='function'?gnDene(()=>htYaklasan(n)):undefined};
const gnF=(ad,...a)=>GN_DIS[ad]?GN_DIS[ad](...a):undefined;
const gnVar=ad=>{switch(ad){case 'mtTarifBul':return typeof mtTarifBul==='function';case 'ypSiradakiIsler':return typeof ypSiradakiIsler==='function';case 'plBugunIsler':return typeof plBugunIsler==='function';case 'plGunOgeleri':return typeof plGunOgeleri==='function';case 'plAkis':return typeof plAkis==='function';case 'plSat':return typeof plSat==='function';case 'plGorevPencere':return typeof plGorevPencere==='function';case 'htYaklasan':return typeof htYaklasan==='function';default:return false}};
const gnBolumRenk=(ad,d)=>(typeof BOLUM!=='undefined'&&BOLUM[ad]&&BOLUM[ad].renk)||d;
const gnTarifBul=id=>gnVar('mtTarifBul')?gnF('mtTarifBul',id):(VERI.TARIF||[]).find(r=>r.id===id);
/* mtGununMenusu() çıktısını {rol, r} listesine çevirir (tarif nesnesi, id, [rol, tarif] ya da {rol, r} kabul edilir) */
function gnMenu(){const M=gnF('mtGununMenusu');if(!M||typeof M!=='object')return null;
 const coz=v=>{if(!v)return null;if(Array.isArray(v)){const c=coz(v[1]);return c?{rol:String(v[0]||''),r:c.r}:null}if(typeof v==='string'){const r=gnTarifBul(v);return r?{rol:'',r}:null}
  if(v.r||v.tarif){const r=typeof(v.r||v.tarif)==='string'?gnTarifBul(v.r||v.tarif):(v.r||v.tarif);return r?{rol:v.rol||v.l||'',r}:null}if(v.ad)return {rol:v.rol||'',r:v};return null};
 const L=x=>(Array.isArray(x)?x:x&&typeof x==='object'?Object.values(x):[]).map(coz).filter(Boolean);
 return {ak:L(M.aksam),kh:L(M.kahvalti),mod:M.mod}}
const gnAna=ak=>ak.find(x=>/ana/i.test(x.rol||''))||ak.find(x=>/ana/i.test(x.r.kat||''))||ak[0];
function gnFoto(){const s=new Date().getHours();return (s<11?fotoAd('kahvalti2'):s<17?fotoAd('gol'):fotoAd('gunbatimi'))||fotoAd('aile')||fotoBolum('plan')}
function gnSelam(){const s=new Date().getHours();return s<5?'İyi geceler':s<11?'Günaydın':s<17?'İyi günler':s<22?'İyi akşamlar':'İyi geceler'}

function gnGorunum(){const h=hava(),[hy,hi]=havaYazi(h.code),ad=S.name?S.name.split(' ')[0]:'';
 const isler=gnVar('plBugunIsler')?gnF('plBugunIsler')||[]:[],gec=isler.filter(x=>x.gecikmis);
 const yak=gnVar('htYaklasan')?(gnF('htYaklasan',7)||[]):[],unut=yak.filter(x=>x.kalan<=1);
 const M=gnMenu(),ak=M?M.ak:[],ana=ak.length?gnAna(ak):null;
 const kmb=gnF('gyGununKombini');
 /* özet cümlesi */
 const oz=[isler.length?isler.length+' iş':'',unut.length?unut.length+' hatırlatma':'',ana?'akşam '+ana.r.ad:''].filter(Boolean).join(' · ');
 const ust=`<header class="kahraman foto gn-h"><div class="fz" style="background-image:url('${gnFoto()||''}')"></div>
  <div class="gn-ust"><span>${esc(uzunTarih())}</span><span class="gn-hv">${ik(hi)}<b>${h.t}°</b>${esc(h.canli||!h.tahmini?hy:'Mevsim ortalaması')}</span></div>
  <small class="gn-sel">${esc(gnSelam())}</small><h1>${ad?esc(ad)+', günün hazır':'Günün hazır'}</h1><p>${esc(oz||'Sakin bir gün seni bekliyor. Keyfini çıkar.')}</p></header>`;
 const ozet=ui.ozet([{ikon:'checklist',deger:isler.length,yazi:gec.length?gec.length+' tanesi gecikti':'Bugünkü iş',renk:'#3456A8',href:'#/plan'},{ikon:'bell',deger:yak.length,yazi:'Hatırlatma (7 gün)',renk:'#9340B0',href:'#/hatir'},{ikon:hi,deger:h.t+'°',yazi:h.max!=null?`Gün içi ${h.min}–${h.max}°`:hy,renk:'#2F7FB8',a:'havaSehir'}]);
 return ust+ozet+gnAksam(ak,ana)+gnGiy(kmb,h)+gnAkis(M,ana)+gnUnutma(unut,gec)+gnAile()+gnPaylasK()}

/* Bu akşam */
function gnAksam(ak,ana){if(!ana)return '';const R=gnBolumRenk('mutfak','#C6531E'),f=fotoTarif(ana.r),dig=ak.filter(x=>x!==ana);
 const kap=`<a class="gn-kap${f?' foto':''}" href="#/tarif/${esc(ana.r.id)}">${f?`<img src="${f}" alt="" loading="lazy">`:`<span class="gn-kbi">${ik('pot')}</span>`}<span class="gn-ky"><small>Bu akşam</small><b>${esc(ana.r.ad)}</b><em>${esc([ana.rol||ana.r.kat||'',ana.r.sure?ana.r.sure+' dk':''].filter(Boolean).join(' · '))}</em></span></a>`;
 const sat=dig.length?ui.satirlar(dig.slice(0,3).map(x=>{const fo=fotoTarif(x.r);return ui.sat({img:fo,ikon:fo?null:'pot',renk:R,baslik:x.r.ad,alt:[x.rol||x.r.kat,x.r.sure?x.r.sure+' dk':''].filter(Boolean).join(' · '),href:'#/tarif/'+x.r.id,ok:1})})):'';
 return `<section class="kart gn-ak" style="${rv(R)}"><div class="kb"><h2>Akşam menüsü</h2><a class="lnk" href="#/mutfak">Menüyü değiştir</a></div>${kap}${sat}</section>`}

/* Bugün bunu giy */
function gnGiy(k,h){if(!k||!Array.isArray(k.parcalar)||!k.parcalar.length)return '';const R=gnBolumRenk('giysem','#B12E62');
 return `<section class="kart gn-giy" style="${rv(R)}"><div class="kb"><h2>Bugün bunu giy</h2><a class="lnk" href="#/giysem">Ne giysem</a></div>${k.baslik?`<p class="gn-gb">${esc(k.baslik)}</p>`:''}
  <div class="gn-pr">${k.parcalar.slice(0,6).map(p=>`<span>${ik(p.ikon||'shirt')}<b>${esc(p.ad||'')}</b></span>`).join('')}</div>${k.not?`<p class="gn-not">${ik(h.rain?'umbrella':'info')}${esc(k.not)}</p>`:h.rain?`<p class="gn-not">${ik('umbrella')}Yağmur bekleniyor; şemsiyeni unutma.</p>`:''}</section>`}

/* Bugünün akışı: görevler + randevular + hatırlatmalar + öğünler */
function gnAkis(M,ana){const t=today();let L=gnVar('plGunOgeleri')?(gnF('plGunOgeleri',t,{hatirsiz:1})||[]):[];
 L=L.filter(o=>o.tur!=='tatil'&&o.tur!=='dini');
 const kh=M&&M.kh&&M.kh.length?M.kh.slice(0,2).map(x=>x.r.ad).join(', '):'';
 const og=[{tur:'ogun',saat:'08:00',baslik:'Kahvaltı',alt:kh,href:'#/mutfak'},{tur:'ogun',saat:'12:30',baslik:'Öğle yemeği',href:'#/mutfak'},{tur:'ogun',saat:'19:00',baslik:'Akşam yemeği',alt:ana?ana.r.ad:'',href:ana?'#/tarif/'+ana.r.id:'#/mutfak'}];
 const ev=gnVar('ypSiradakiIsler')?(gnF('ypSiradakiIsler',3)||[]):[];
 const evL=(Array.isArray(ev)?ev:[]).map(x=>typeof x==='string'?{baslik:x}:x).filter(x=>x&&(x.baslik||x.ad||x.t)).map(x=>({tur:'rec',saat:x.saat||'',baslik:x.baslik||x.ad||x.t,alt:x.alt||'Ev işi',href:x.href||'#/yapsam'}));
 const zaman=[...L.filter(o=>o.saat),...og,...evL.filter(o=>o.saat)].sort((a,b)=>a.saat.localeCompare(b.saat));
 const gun=[...L.filter(o=>!o.saat),...evL.filter(o=>!o.saat)];
 const akis=gnVar('plAkis')?gnF('plAkis',zaman,{bugun:1}):'';
 const gunH=gun.length&&gnVar('plSat')?`<div class="gn-gi"><small>Gün içinde</small>${ui.satirlar(gun.map(o=>gnF('plSat',o,{saatsiz:1})))}</div>`:'';
 return `<section class="kart gn-akis" style="${rv('#3456A8')}"><div class="kb"><h2>Bugünün akışı</h2><a class="lnk" href="#/plan">Planım</a></div>${akis}${gunH}${gnVar('plGorevPencere')?`<div class="gn-ekle">${ui.btn('Bir iş ekle',{a:'plYeni',ikon:'plus',sinif:'hafif genis'})}</div>`:''}</section>`}

/* Unutma: bugün/yarın son tarihli hatırlatmalar + gecikmiş işler */
function gnUnutma(unut,gec){if(!unut.length&&!gec.length)return '';
 const tur=k=>typeof HT_TUR!=='undefined'&&HT_TUR[k]?HT_TUR[k]:['Hatırlatma','bell','#9340B0'];
 const sat=[...unut.slice(0,4).map(x=>{const [ty,i,c]=tur(x.tur);return ui.sat({ikon:i,renk:c,baslik:x.baslik,alt:[ty,x.yas].filter(Boolean).join(' · '),sag:`<span class="gn-kl${x.kalan<0?' gec':''}">${esc(x.kalan<0?(-x.kalan)+' gün geçti':x.kalan===0?'Bugün':'Yarın')}</span>`,href:'#/hatir'})}),
  ...gec.slice(0,3).map(x=>ui.sat({ikon:'alert',renk:'#C2410C',baslik:x.t,alt:'Gecikmiş iş · '+tarih(x.date),sag:`<span class="gn-kl gec">Gecikti</span>`,href:'#/plan'}))];
 return `<section class="kart gn-un" style="${rv('#9340B0')}"><div class="kb"><h2>Unutma</h2><a class="lnk" href="#/hatir">Tümü</a></div>${ui.satirlar(sat)}</section>`}

/* Ailecek ne yapalım */
function gnAile(){const L=gnF('ypGununOnerileri',2,'Aileyle');if(!Array.isArray(L)||!L.length)return '';const R=gnBolumRenk('yapsam','#3A8A3E');
 return `<section class="kart gn-ai" style="${rv(R)}"><div class="kb"><h2>Ailecek ne yapalım?</h2><a class="lnk" href="#/yapsam">Daha fazla</a></div><div class="izgara gn-iz">${L.slice(0,2).map(x=>ui.kutu({baslik:x.baslik||'',alt:x.alt||'',foto:x.foto||null,ikon:x.ikon||'users',href:x.href||'#/yapsam'})).join('')}</div></section>`}

/* Günümü paylaş */
function gnPaylasK(){return `<section class="kart gn-pay"><span class="gn-pi">${ik('whatsapp')}</span><div><b>Günümü paylaş</b><small>Bugünün planını eşine ya da ailene gönder</small></div>${ui.btn('Gönder',{a:'gnPaylas',ikon:'share',sinif:'kucuk'})}</section>`}
function gnMetin(){const h=hava(),[hy]=havaYazi(h.code);let s='☀️ *Bugünüm* — '+uzunTarih()+'\n🌤️ Hava: '+h.t+'° '+hy;
 const L=gnVar('plGunOgeleri')?(gnF('plGunOgeleri',today(),{hatirsiz:1})||[]).filter(o=>(o.tur==='todo'||o.tur==='rec'||o.tur==='ev')&&!o.done):[];
 if(L.length)s+='\n\n✅ *Yapılacaklar*\n'+L.map(o=>'• '+(o.saat?o.saat+' ':'')+o.baslik+(o.kim&&o.kim!=='Ben'?' ('+o.kim+')':'')).join('\n');
 const U=gnVar('htYaklasan')?(gnF('htYaklasan',1)||[]):[];if(U.length)s+='\n\n🔔 *Unutma*\n'+U.map(x=>'• '+x.baslik+' — '+(x.kalan<0?(-x.kalan)+' gün geçti':x.kalan===0?'bugün':'yarın')).join('\n');
 const M=gnMenu();if(M&&M.ak.length)s+='\n\n🍽️ *Akşam menüsü*\n'+M.ak.map(x=>'• '+x.r.ad).join('\n');
 const k=gnF('gyGununKombini');if(k&&Array.isArray(k.parcalar)&&k.parcalar.length)s+='\n\n👕 *Bugün giy:* '+k.parcalar.map(p=>p.ad).join(', ');
 return s+'\n\n— BUGÜNÜM ile hazırlandı'}
eylem('gnPaylas',()=>waPaylas(gnMetin()));

/* ---- src/bolum/hatir.js ---- */
/* ===== Hatırlatmalar (eski adı "Aklımdan Çıkmasın") — özel günler, faturalar, belgeler, bakımlar =====
   Veri (eski sürümle aynı şekil):
   S.hatir = {items:[{id, ad, kat, tip:'t'|'a', tarih, tekrar:'yok'|'ay'|'yil', aralik, son, once, not, done:{tarih:true}, im?}],
              cins:'kadin'|'erkek', kislik:true, kdone:{'YYYY-ay':{i:true}}, mig:1}
   tip 't' = tarihli (tek sefer / her ay / her yıl), tip 'a' = aralıklı (en son yapıldığı günden "aralik" gün sonra).
   Diğer bölümler için: htYaklasan(gun), htEkle({…}), htGunde(tarih), htTurAd(kat) */
const HT_RENK='#9340B0';
/* tür: [ad, simge, renk] — sıra eski HK ile aynı */

/* eski resim adları → v2 simgeleri */

const htTurAd=k=>(HT_TUR[k]||HT_TUR.diger)[0];

/* ---------- veri ---------- */
function htVeri(){const H=bolum('hatir',{items:[],cins:'kadin',kislik:true,kdone:{}});H.items=Array.isArray(H.items)?H.items:[];H.kdone=H.kdone||{};if(H.cins==null)H.cins='kadin';if(H.kislik==null)H.kislik=true;
 if(!H.mig){H.mig=1;const G=S.gunluk||{};(G.ozel||[]).forEach(x=>H.items.push({id:x.id||uid(),ad:x.ad+(x.tur&&x.tur!=='Diğer'?' · '+x.tur:''),kat:'ozel',tip:'t',tarih:x.tarih,tekrar:x.tekrar==='Tek sefer'?'yok':'yil',once:3,not:'',done:{}}));if(G.ozel&&G.ozel.length){G.ozel=[]}save()}
 H.items.forEach(x=>{if(!x.id)x.id=uid();if(!x.done||typeof x.done!=='object')x.done={}});return H}
const htYil=()=>new Date().getFullYear();
/* sıradaki tarih (eski hDue ile aynı kural) */
function htVade(x){const t=today();
 if(x.tip==='a')return x.son?addDays(x.son,+x.aralik||30):t;
 if(!x.tarih)return t;
 if(x.tekrar==='yok')return x.tarih;
 if(x.tekrar==='yil'){let d=htYil()+x.tarih.slice(4);if(d<t)d=(htYil()+1)+x.tarih.slice(4);const once=(+d.slice(0,4)-1)+x.tarih.slice(4);if(once>=x.tarih&&!x.done[once]&&daysTo(once)>=-30&&daysTo(once)<0)return once;if(x.done[d])d=(+d.slice(0,4)+1)+x.tarih.slice(4);return d}
 if(x.tekrar==='ay'){const gun=+x.tarih.slice(8);const yap=(y,m)=>{const son=new Date(y,m+1,0).getDate();return ymd(new Date(y,m,Math.min(gun,son)))};const n=new Date();let y=n.getFullYear(),m=n.getMonth();
  const pd=yap(m?y:y-1,m?m-1:11);if(pd>=x.tarih&&!x.done[pd]&&daysTo(pd)>=-20&&daysTo(pd)<0)return pd;let d=yap(y,m);if(d<t&&d>=x.tarih&&!x.done[d]&&daysTo(d)>=-20)return d;if(d<t||x.done[d]){m++;if(m>11){m=0;y++}d=yap(y,m)}return d}
 return x.tarih}
const htKalan=x=>daysTo(htVade(x));
const htBitti=x=>x.tip==='t'&&x.tekrar==='yok'&&!!(x.done&&x.done[x.tarih]);
const htTekYazi=x=>x.tip==='a'?(x.aralik%365===0?(x.aralik/365===1?'Her yıl':x.aralik/365+' yılda bir'):x.aralik%30===0?(x.aralik/30===1?'Her ay':x.aralik/30+' ayda bir'):x.aralik%7===0?(x.aralik/7===1?'Her hafta':x.aralik/7+' haftada bir'):x.aralik+' günde bir'):x.tekrar==='yil'?'Her yıl':x.tekrar==='ay'?'Her ay':'Tek sefer';
const htYas=x=>{if(x.kat!=='ozel'||x.tekrar!=='yil'||!x.tarih)return '';const dg=/doğum/i.test(x.ad),yd=/yıldönüm/i.test(x.ad);if(!dg&&!yd)return '';const y=+htVade(x).slice(0,4)-+x.tarih.slice(0,4);return y>0&&x.tarih.slice(0,4)>'1900'?`${y}. ${dg?'yaşı':'yıl'}`:''};

const htOkYazi=x=>x.kat==='odeme'||(x.kat==='arac'&&/MTV|sigorta|kasko/i.test(x.ad))?'Ödendi':x.kat==='ozel'?'Kutladım':'Yaptım';
const htSablon=k=>((VERI.HSAB||{})[k]||[['Hatırlatma','t','yok',1,'']]);

/* açık (bitmemiş) hatırlatmalar kalan güne göre */
const htAcik=()=>htVeri().items.filter(x=>!htBitti(x)).map(x=>({x,n:htKalan(x)})).sort((a,b)=>a.n-b.n);

/* ---------- dışarıya açık işlevler ---------- */
/* n gün içindeki hatırlatmalar (gecikenler dahil, kalan<0): [{baslik, tarih, kalan, tur, turAd, id, tekrar}] */
function htYaklasan(gun){gun=gun==null?7:gun;return htAcik().filter(a=>a.n<=gun&&a.n>=-30).map(a=>({baslik:a.x.ad,tarih:htVade(a.x),kalan:a.n,tur:a.x.kat||'diger',turAd:htTurAd(a.x.kat),id:a.x.id,tekrar:htTekYazi(a.x),yas:htYas(a.x)}))}
/* o güne düşen hatırlatmalar (takvim için) */

/* hatırlatma ekle: htEkle({ad|baslik, kat|tur, tarih, tekrar, once, not, tip, aralik, son}) → eklenen öğe */
function htEkle(o){o=o||{};const ad=String(o.ad||o.baslik||'').trim();if(!ad)return null;const kat=HT_TUR[o.kat||o.tur]?(o.kat||o.tur):'diger';const tip=o.tip==='a'||o.aralik?'a':'t';
 const x={id:uid(),ad:bas(ad),kat,tip,once:o.once!=null?+o.once:3,not:String(o.not||'').trim(),done:{},_u:Date.now()};
 if(tip==='a'){x.aralik=+o.aralik||30;x.son=o.son||''}else{x.tarih=o.tarih||today();x.tekrar=['yok','ay','yil'].includes(o.tekrar)?o.tekrar:(kat==='ozel'?'yil':'yok')}

/* ---------- parçalar ---------- */
function htSayac(n,x){const acil=n<=((x&&x.once)||0)||n<=1;return `<span class="ht-k${n<0?' gec':acil?' acil':''}">${n<0?`<b>${-n}</b><small>gün geçti</small>`:n===0?`<b class="yz">Bugün</b>`:n===1?`<b class="yz">Yarın</b>`:`<b>${n}</b><small>gün</small>`}</span>`}
function htSat(a,turlu){const x=a.x,n=a.n,[ta,,tr]=htTur(x.kat),yas=htYas(x);

/* ---------- görünüm ---------- */
function htGorunum(){const H=htVeri(),sek=tab('hatir','yak'),A=htAcik();
 const hafta=A.filter(a=>a.n>=0&&a.n<=7).length,gec=A.filter(a=>a.n<0).length;
 const alt=!A.length?'Doğum günleri, faturalar, belgeler ve bakımlar; zamanı gelince hatırlatırım.':gec?`${gec} hatırlatma gecikti${hafta?' · bu hafta '+hafta+' tane daha':''}`:hafta?`Bu hafta ${hafta} şey yaklaşıyor`:'Bu hafta rahatsın · '+A.length+' hatırlatma takipte';
 const ust=ui.kahraman({baslik:'Hatırlatmalar',ikon:'bell',foto:fotoBolum('hatir'),alt:esc(alt),eylemler:ui.btn('Hatırlatma ekle',{a:'htYeni',ikon:'plus',sinif:'altin'})});
 const sk=ui.sekme('hatir',[['yak','Yaklaşanlar'],['bakim','Kendine bak'],['kislik','Kışlık']],sek);
 return ust+sk+(sek==='bakim'?htBakim():sek==='kislik'?htKislik():htYak())}

function htYak(){const A=htAcik(),H=htVeri();
 if(!A.length)return ui.kart({ic:ui.bos({ikon:'bell',baslik:'Hiçbir şey unutulmasın',yazi:'Doğum günü, fatura, sigorta, pasaport ya da kombi bakımı; tarihini yaz, zamanı gelince hatırlatayım.'})})+htTurIzgara('Neyi hatırlatayım?');
 const tur=cipAl('htTur','tum');const var_=Object.keys(HT_TUR).filter(k=>A.some(a=>a.x.kat===k));
 const cip=var_.length>1?ui.cipler('htTur',[['tum','Tümü'],...var_.map(k=>[k,htTur(k)[0]+' · '+A.filter(a=>a.x.kat===k).length,htTur(k)[1]])],var_.includes(tur)?tur:'tum'):'';
 const L=A.filter(a=>tur==='tum'||!var_.includes(tur)||a.x.kat===tur);
 /* sıradaki: en yakın gelecek */
 const sira=L.find(a=>a.n>=0)||L[0];let one='';

  one=`<section class="kart vurgu ht-one" style="${rv(htTur(x.kat)[2])}"><div class="ht-oy"><span class="ht-oi">${ik(htSimge(x))}</span><div class="ht-ot"><small>Sıradaki · ${esc(ta)}</small><b>${esc(x.ad)}</b><span>${esc(tarih(htVade(x),{gun:1}))}${yas?' · '+esc(yas):''}</span></div><div class="ht-os">${sira.n<0?`<b>${-sira.n}</b><small>gün geçti</small>`:sira.n===0?`<b class="yz">Bugün</b>`:sira.n===1?`<b class="yz">Yarın</b>`:`<b>${sira.n}</b><small>gün kaldı</small>`}</div></div>${x.not?`<p class="ht-on">${esc(x.not)}</p>`:''}<div class="ht-ob">${ui.btn(htOkYazi(x),{a:'htOk',data:{id:x.id},ikon:'check',sinif:'altin kucuk'})}${ui.btn('Düzenle',{a:'htDuz',data:{id:x.id},ikon:'edit',sinif:'cam kucuk'})}</div></section>`}

  return `<section class="kart${b==='Gecikenler'?' ht-gec':''}"><div class="kb"><h2>${b}</h2><span class="ht-say">${G.length}</span></div>${ui.satirlar((sonra?G.slice(0,5):G).map(a=>htSat(a,tur==='tum')))}${sonra?`<div class="ht-df">${ui.btn(G.length-5+' tane daha göster',{a:'htSonraAc',sinif:'cizgi kucuk'})}</div>`:''}</section>`}).join('');
 /* kışlık hatırlatması: ayın ilk yarısı */

/* ===== Ne İçsem? — içecekler =====
   Günün içeceği (havaya ve saate göre), ekipmanım, kategoriler, arama, demleme rehberi.
   Tarif sayfası mutfak bölümüyle ortaktır (#/tarif/<id>), renk ve üst bilgi içecekten gelir.
   Veri (eski sürümle aynı): S.icsem = {eq:'hepsi'|'cezve'|…, kat:'Hepsi'|…, pick:{date,id}|null}; favoriler S.mutfak.fav, kendi içeceklerim S.myR (icecek:1).
   Not: bu dosya mutfak.js'ten önce yüklenir; mt… işlevleri yalnız işlev içinde çağrılır. */
const IC_RENK='#7A4B2E';
const IC_KAT=[['Hepsi','Hepsi'],['Kahve','Kahve','cup'],['Sıcak İçecek','Sıcak içecek','fire'],['Soğuk İçecek','Soğuk içecek','snow'],['Geleneksel','Geleneksel'],['Çocuklar İçin','Çocuklar için','smile'],['Kafeinsiz','Kafeinsiz','leaf'],['Favoriler','Favoriler','heart']];
const IC_DEM=[['Demlik çay','Her bardak için 1 tatlı kaşığı çay. Alttaki demlikte su kaynasın, çayı üst demlikte buharda 2–3 dk ısıt, kaynar suyu ekle ve kısık ateşte 12–15 dk demle. Demlendikten sonra 30–40 dk içinde iç.'],
 ['Türk kahvesi','1 fincan (70 ml) soğuk suya 1 dolu tatlı kaşığı (7 g) kahve. Cezvede karıştır, kısık ateşte köpük kabarınca fincana köpüğü paylaştır, bir kez daha kabartıp dök.'],
 ['French press','Kahve ve su oranı 1:15 (300 ml suya 20 g iri çekilmiş kahve). Su kaynadıktan 30 sn sonra dök, 4 dk beklet, pistonu yavaşça bastır.'],
 ['Filtre / V60','Oran 1:16 (250 ml suya 15 g orta çekim). Su 92–96 °C olsun. Önce 30 ml ile 30 sn ön demleme yap, sonra dairesel dökerek toplam 2,5–3 dk.'],
 ['Moka pot','Alt hazneyi supap hizasına kadar sıcak suyla doldur, sepeti bastırmadan doldur, orta ateşe koy. Kaynama sesi gelince ocaktan al.'],
 ['Soğuk demleme','Oran 1:8 iri çekim kahve ve soğuk su. Buzdolabında 12–18 saat beklet, süz. Kapalı kapta buzdolabında 1 haftaya kadar saklanır.']];
const icKafeinli=r=>!!r&&(r.kat==='Kahve'||/kahve|latte|mocha|cappuccino|americano|frappe|affogato|cold brew|flat white|v60|moka|espresso/i.test(r.ad)||(/çay/i.test(r.ad)&&!/papatya|ıhlamur|ada çayı|kuşburnu|rezene|elma tarçın|zencefil|nane|ihlamur/i.test(r.ad))||/kakao|çikolata|mocha/i.test(r.ad));
function icI(){const I=bolum('icsem',{eq:'hepsi',kat:'Hepsi',pick:null});if(!I.eq)I.eq='hepsi';if(!I.kat)I.kat='Hepsi';return I}
const icHepsi=()=>mtTumu().filter(r=>r.icecek);
const icEqUygun=(r,eq)=>!eq||eq==='hepsi'||r.kat!=='Kahve'||(Array.isArray(r.eq)&&r.eq.includes(eq));
/* günün içeceği: öğleden önce kahve, akşamüstü kafeinsiz; hava 22°'nin altındaysa sıcak */
function icHavuz(){const hv=hava(),sicak=hv.t<22,kahve=new Date().getHours()<16,eq=icI().eq;const L=icHepsi().filter(r=>!r.benim&&r.kat!=='Çocuklar İçin');
 let P=L.filter(r=>!!r.sicak===sicak&&(kahve?r.kat==='Kahve':!icKafeinli(r)));const P2=P.filter(r=>icEqUygun(r,eq));if(P2.length)P=P2;if(!P.length)P=L.filter(r=>!!r.sicak===sicak);if(!P.length)P=L;return {P,sicak,kahve,hv}}
function icGununIcecegi(){const I=icI();if(I.pick&&I.pick.date===today()){const r=mtTarifBul(I.pick.id);if(r)return r}
 const {P,kahve}=icHavuz();if(!P.length)return null;const rr=mtTohum(gunIdx()*11+(kahve?3:57));const W=P.map(r=>(fotoTarif(r)?3:1));const T=W.reduce((a,b)=>a+b,0);let x=rr()*T;for(let i=0;i<P.length;i++){x-=W[i];if(x<=0)return P[i]}return P[0]}
/* {etiket, neden} — kartlarda kısa açıklama */
function icNeden(r){const hv=hava(),sa=new Date().getHours();const et=r&&r.kat==='Kahve'?'Günün kahvesi':'Günün içeceği';
 const n=r&&r.sicak?(hv.canli||hv.t!=null?`Hava ${hv.t}°, sıcak bir şey iyi gider.`:'Sıcak bir mola zamanı.'):`Hava ${hv.t}°, serinletici bir şey iyi gider.`;
 return {etiket:et,neden:sa>=16&&r&&!icKafeinli(r)?n.replace(/\.$/,'')+'; üstelik kafeinsiz.':n}}

let icSayfa=24,_icSayfaAn='',icQ='';
function icsemGorunum(){const I=icI(),g=icGununIcecegi(),hv=hava();
 const ust=ui.kahraman({baslik:'Ne İçsem?',alt:`Kahve, çay, sıcak ve soğuk ${icHepsi().length} içecek tarifi.`,foto:fotoBolum('icsem')||fotoBolum('icsemw'),ikon:'cup',eylemler:ui.btn('İçecek ekle',{a:'icEkle',ikon:'plus',sinif:'cam'})});
 let h=ust;
 if(g){const f=mtFoto(g),N=icNeden(g);
  h+=`<section class="kart vurgu ic-gun"><a class="ic-gf${f?' foto':''}" href="#/tarif/${encodeURIComponent(g.id)}">${f?`<img src="${f}" alt="">`:`<span class="ic-gfi">${ik(mtIkon(g))}</span>`}</a><div class="ic-gy"><span class="ic-et">${esc(N.etiket)}</span><h2>${esc(g.ad)}</h2><p>${esc(N.neden)} ${esc(mtSure(g.sure))} sürer.</p><div class="ic-gd"><a class="btn altin" href="#/tarif/${encodeURIComponent(g.id)}">${ik('book')}Tarife git</a>${ui.btn('Başka öner',{a:'icPick',ikon:'refresh',sinif:'cam'})}</div></div></section>`}
 /* ekipman */
 const EQ=VERI.EQ||[['hepsi','Hepsi']];
 h+=`<div class="ic-bas"><h2>Ekipmanım</h2><small>Kahve tarifleri buna göre süzülür</small></div><div class="cipler" role="group" aria-label="Ekipmanım">${EQ.map(([v,y])=>`<button type="button" class="cip${I.eq===v?' on':''}" data-a="icEq" data-v="${esc(v)}" aria-pressed="${I.eq===v}">${esc(v==='hepsi'?'Hepsi':y)}</button>`).join('')}</div>`;
 /* liste */
 const my=(S.myR||[]).filter(r=>r&&r.icecek);const K=[...IC_KAT,...(my.length?[['Benim','Benim içeceklerim','edit']]:[])];const kat=K.some(x=>x[0]===I.kat)?I.kat:'Hepsi';
 let L=icHepsi().filter(r=>icEqUygun(r,I.eq));
 L=kat==='Hepsi'?L:kat==='Favoriler'?L.filter(r=>mtFavMi(r.id)):kat==='Kafeinsiz'?L.filter(r=>!icKafeinli(r)):kat==='Benim'?L.filter(r=>r.benim):L.filter(r=>r.kat===kat);
 const sk=icQ.trim()?mtAraSkor(icQ,L):null;if(sk)L=sk;
 const an=kat+'|'+icQ+'|'+I.eq;if(an!==_icSayfaAn){_icSayfaAn=an;icSayfa=24}
 h+=`<div class="ic-bas"><h2>İçecekler</h2></div>`+ui.ara('icAra',icQ,'İçecek ara: limon, süt, buzlu…')+`<div class="cipler">${K.map(([v,y,i])=>`<button type="button" class="cip${v===kat?' on':''}" data-a="icKat" data-v="${esc(v)}">${i?ik(i):''}${esc(y)}</button>`).join('')}</div>`;
 if(!L.length)h+=ui.kart({ic:kat==='Favoriler'&&!icQ.trim()?ui.bos({ikon:'heart',baslik:'Henüz favori içeceğin yok',yazi:'Beğendiğin içeceklerin kalbine dokun; burada toplansın.',btn:{yazi:'Bütün içecekler',a:'icKat',data:{v:'Hepsi'}}}):ui.bos({ikon:'cup',baslik:'Bu seçime uygun içecek yok',yazi:'Başka bir ekipman, kategori ya da kelime dene.',btn:{yazi:'Seçimleri temizle',a:'icTemizle'}})});
 else{h+=`<p class="mt-say">${L.length} içecek</p>`+mtIzgara(L.slice(0,icSayfa));if(L.length>icSayfa)h+=ui.dahaFazla('icDaha',null,`Daha fazla göster · ${L.length-icSayfa} içecek daha`)}
 /* demleme rehberi */
 h+=ui.kart({baslik:'Demleme rehberi',ac:'Oranlar ve süreler, tek bakışta.',ic:ui.satirlar(IC_DEM.map(([t],i)=>ui.sat({ikon:['cup','cup','cup','drop','fire','snow'][i]||'cup',renk:IC_RENK,baslik:t,alt:'Oran ve süre',a:'icDem',data:{i},ok:1})))});
 return h}

/* ===== Alışveriş listesi — aileden bağımsız, her zaman bir dokunuş uzakta =====
   Veri: S.mutfak.liste = [{id, ad, q, u, k, r, done, t, kim?}]  (eski sürümle aynı)
   S.mutfak.sik = {ad: kaç kez eklendi}  — sık eklenenler öneri olur */
const LISTE_RENK='#0B7A8C';
const REYON=[['manav','Manav','leaf'],['firin','Fırın','bread'],['sut','Süt ve kahvaltılık','cheese'],['et','Et, tavuk, balık','meat'],['kuru','Bakliyat ve kuru gıda','wheat'],['kiler','Kiler','jar'],['icecek','İçecek','bottle'],['atis','Atıştırmalık','cookie'],['temiz','Temizlik','spray'],['bakim','Kişisel bakım','bath'],['bebek','Bebek','baby'],['pet','Evcil hayvan','paw'],['diger','Diğer','bag']];
const REYON_ESLE={sebze:'manav',meyve:'manav',firin:'firin',sut:'sut',et:'et',kuru:'kuru',kiler:'kiler',icecek:'icecek',atis:'atis',temiz:'temiz',bakim:'bakim',bebek:'bebek',pet:'pet'};
const BIRIMLER=['kg','gr','g','lt','litre','ml','adet','paket','demet','kutu','şişe','kavanoz','file','baş','koli','düzine','poşet','dilim'];
/* ad → reyon */
let _reyonHarita=null;
function reyonBul(ad){if(!_reyonHarita){_reyonHarita=[];(VERI.KAT||[]).forEach(([n,k])=>_reyonHarita.push([norm(n.replace(/\(.*?\)/,'').trim()),REYON_ESLE[k]||'diger']));const ek={manav:['domates','biber','limon','elma','muz','portakal','mandalina','marul','roka','maydanoz','dereotu','nane','salatalik','patates','sogan','sarimsak','havuc','kabak','patlican','ispanak','mantar','cilek','uzum','karpuz','kavun','armut','nar','ayva','kivi'],firin:['ekmek','simit','pide','lavas','yufka','pogaca','galeta'],sut:['sut','yogurt','peynir','kasar','tereyag','kaymak','ayran','zeytin','yumurta','labne','lor'],et:['kiyma','tavuk','et','balik','sucuk','salam','sosis','pastirma','hindi','kofte'],kuru:['pirinc','bulgur','mercimek','nohut','fasulye','makarna','sehriye','un','irmik','yulaf','barbunya'],kiler:['seker','tuz','yag','salca','sirke','bal','recel','cay','kahve','baharat','kakao','maya','nisasta','zeytinyag'],icecek:['su','maden suyu','meyve suyu','gazoz','kola','soda'],atis:['cikolata','biskuvi','cips','kuruyemis','kraker','gofret'],temiz:['deterjan','yumusatici','camasir','bulasik','sabun','cop','sunger','temizleyici','kagit havlu','pecete','tuvalet kagidi','pecete'],bakim:['sampuan','dis','krem','deodorant','tiras','ped','pamuk'],bebek:['bebek','bez','mama'],pet:['kedi','kopek','kum']};Object.entries(ek).forEach(([r,L])=>L.forEach(n=>_reyonHarita.push([n,r])));_reyonHarita.sort((a,b)=>b[0].length-a[0].length)}
 const s=norm(ad);for(const [n,r] of _reyonHarita){if(n&&(s===n||s.startsWith(n+' ')||s.endsWith(' '+n)||s.includes(n)))return r}return 'diger'}
/* "2 kg domates", "domates 2kg", "3 ekmek", "yarım kg peynir" */
function urunCoz(t){t=String(t||'').trim().replace(/\s+/g,' ');if(!t)return null;let q=null,u='',ad=t;const yarim=/^yar[ıi]m\s+/i;if(yarim.test(ad)){q=.5;ad=ad.replace(yarim,'')}
 const bu=BIRIMLER.join('|');let m=ad.match(new RegExp('^(\\d+(?:[.,]\\d+)?)\\s*('+bu+')?\\.?\\s+(.+)$','i'));
 if(m){q=sayi(m[1]);u=(m[2]||'').toLowerCase();ad=m[3]}else{m=ad.match(new RegExp('^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*('+bu+')?$','i'));if(m){ad=m[1];q=sayi(m[2]);u=(m[3]||'').toLowerCase()}else if(q!=null){m=ad.match(new RegExp('^('+bu+')\\s+(.+)$','i'));if(m){u=m[1].toLowerCase();ad=m[2]}}}
 if(q!=null&&!u)u='adet';ad=bas(ad.trim());return {ad,q,u}}

function mtEtiket(r){if(r._t)return r._t;const k=new Set(r.m.map(i=>i[3]).filter(Boolean)),t=new Set(),s=r.s.join(' ').toLocaleLowerCase('tr'),ad=r.ad.toLocaleLowerCase('tr');
 const etli=['et','kıyma','sucuk','kavurma','ciğer'].some(x=>k.has(x)),tav=k.has('tavuk'),bal=['balık','karides','ton balığı'].some(x=>k.has(x));
 if(etli)t.add('etli');if(tav)t.add('tavuk');if(bal)t.add('balik');if(!etli&&!tav&&!bal)t.add('etsiz');
 if(['kuru fasulye','nohut','mercimek','yeşil mercimek','barbunya','börülce'].some(x=>k.has(x)))t.add('bakliyat');
 if(r.sure<=30)t.add('pratik');if(/fırın/.test(s))t.add('firin');if(/kızart/.test(s))t.add('kizartma');
 if(!etli&&!bal&&!['Tatlı','Kek & Pasta'].includes(r.kat))t.add('ekonomik');
 if((etli&&r.zor!=='Kolay')||(/dolma|sarma|kebab|baklava|börek|güveç|tandır|kapama|beğendi|iç pilav|mantı|künefe|kadayıf|profiterol|trileçe|cheesecake|pasta/.test(ad)&&r.sure>=40))t.add('misafir');
 const aci=r.m.some(i=>i[3]&&/acı|isot/.test(String(i[2]).toLocaleLowerCase('tr')));
 if(r.cocuk||(!aci&&/köfte|makarna|pilav|tavuk|patates|pankek|krep|kek|kurabiye|tost|pizza|börek|muhallebi|sütlaç|omlet|mücver|şinitzel|çorba|supangle|pişi|poğaça|muffin|brownie|kazandibi|keşkül|baget|kanat|mantı|erişte/.test(ad)))t.add('cocuk');
 for(const m in MT_SEZONK)if(MT_SEZONK[m].some(x=>k.has(x)))t.add('m_'+m);
 try{Object.defineProperty(r,'_t',{value:t,enumerable:false,configurable:true})}catch(e){}return t}
const mtModListe=m=>String(m||'her').split('+').filter(x=>x&&x!=='her');
function mtModUygun(r,mode){const L=mtModListe(mode);return L.every(x=>{const t=mtEtiket(r);if(x==='misafir')return t.has('misafir')||['Tatlı','Kek & Pasta','Salata & Meze','Zeytinyağlı','Pilav & Makarna','Çorba'].includes(r.kat);if(x==='cocuk')return t.has('cocuk')||(['Tatlı','Kek & Pasta','Pilav & Makarna'].includes(r.kat)&&!r.m.some(i=>/acı|isot/.test(i[2])));return t.has(x)})}
const mtAnaK=r=>new Set(r.m.map(i=>i[3]).filter(k=>MT_BIGK.includes(k)));
const mtCakisir=(a,b)=>{if(!a||!b)return false;const A=mtAnaK(a);for(const k of mtAnaK(b))if(A.has(k))return true;return mtEtiket(a).has('kizartma')&&mtEtiket(b).has('kizartma')};

/* ---------- menü üretimi ---------- */
function mtTohum(seed){let x=Math.abs(Math.floor(seed))%233280;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function mtYakin(gun,atla){const H=mtM().hist,o={};Object.entries(H).forEach(([d,ids])=>{if(d===atla||!Array.isArray(ids))return;const n=-daysTo(d);if(n>=0&&n<=gun)ids.forEach(id=>o[id]=Math.min(o[id]==null?99:o[id],Math.max(1,n)))});return o}
function mtAgirlik(r,c){let w=1;const t=mtEtiket(r),ms=c.ms;
 if(t.has('m_'+ms))w*=2.2;else if(['yaz','kis','bahar'].some(m=>m!==ms&&t.has('m_'+m)))w*=ms==='sonbahar'&&t.has('m_yaz')?0.7:0.35;
 const rc=c.rec[r.id];if(rc!=null)w*=rc<=3?0.03:rc<=7?0.2:0.6;
 if(mtFavMi(r.id))w*=1.8;
 const hv=c.hv;if(hv){if(hv.t>=26){if(['Zeytinyağlı','Salata & Meze'].includes(r.kat))w*=1.6;if(r.kat==='Çorba'&&!/yayla|ayran|domates|lebeniye/.test(r.ad.toLocaleLowerCase('tr')))w*=0.55}else if(hv.t<=10){if(r.kat==='Çorba'||t.has('bakliyat')||t.has('etli'))w*=1.4;if(r.kat==='Zeytinyağlı')w*=0.7}}
 if(c.tercih&&c.tercih(r))w*=3;return w}
function mtSec(L,c,rr){if(!L.length)return null;const ws=L.map(r=>mtAgirlik(r,c)),T=ws.reduce((a,b)=>a+b,0);let x=rr()*T;for(let i=0;i<L.length;i++){x-=ws[i];if(x<=0)return L[i]}return L[L.length-1]}
function mtHavuz(og,k,kats,o){o=o||{};const no=new Set(mtM().no);
 let L=mtYemekler().filter(x=>kats.includes(x.kat)&&!no.has(x.id)&&x.id!==o.excl&&!MT_SAKLA.includes(x.kat));
 if(og==='kahvalti'&&k==='y')L=L.filter(x=>mtEtiket(x).has('etsiz')&&x.sure<=35&&!/humus|fava|çerkez|rus/.test(x.ad.toLocaleLowerCase('tr')));
 if(o.avoid)L=L.filter(x=>!o.avoid.some(a=>mtCakisir(a,x)));
 if(mtModListe(o.mode).includes('etsiz')){const e=L.filter(x=>mtEtiket(x).has('etsiz'));if(e.length)L=e}
 const md=L.filter(x=>mtModUygun(x,o.mode));if(md.length)L=md;
 return L}
const MT_ESLES={bakliyat:r=>/pilav/.test(r.ad.toLocaleLowerCase('tr'))&&r.kat==='Pilav & Makarna'||/turşu|piyaz/.test(r.ad.toLocaleLowerCase('tr')),kofte:r=>/piyaz|salata|pilav|cacık/.test(r.ad.toLocaleLowerCase('tr')),balik:r=>r.kat==='Salata & Meze'&&mtEtiket(r).has('etsiz'),sebze:r=>/pilav|cacık|haydari/.test(r.ad.toLocaleLowerCase('tr'))};
const mtEsTur=a=>{if(!a)return null;const t=mtEtiket(a),ad=a.ad.toLocaleLowerCase('tr');return t.has('bakliyat')?'bakliyat':/köfte/.test(ad)?'kofte':t.has('balik')?'balik':t.has('etsiz')&&a.kat!=='Pilav & Makarna'?'sebze':null};
function mtRolSec(og,k,m,mode,rr,rec){const role=MT_OG[og].roller.find(x=>x[0]===k);if(!role)return null;const get=x=>mtTarifBul(m[x]);const avoid=[];
 if(k==='c'&&get('a'))avoid.push(get('a'));if(k==='a'&&get('c'))avoid.push(get('c'));if(k==='y')['a','c'].forEach(x=>get(x)&&avoid.push(get(x)));
 const pk=k==='y'?mtEsTur(get('a')):null;const c={rec,hv:hava(),ms:mtMevsim(),tercih:pk?MT_ESLES[pk]:null};
 const L=mtHavuz(og,k,role[2],{avoid,mode,excl:m[k]});return mtSec(L,c,rr)||mtSec(mtHavuz(og,k,role[2],{}),c,rr)}
function mtMenuUret(og,mode,rr,rec){const m={};const sira=[...MT_OG[og].roller].sort((x,y)=>(x[0]==='a'?-1:y[0]==='a'?1:0));
 for(const [k] of sira){const r=mtRolSec(og,k,m,mode,rr,rec);if(r)m[k]=r.id}return m}
const mtMenuAnahtar=(og,mode)=>og+(mode&&mode!=='her'?':'+mode:'');
function mtSabitUygula(date,og,m){const M=mtM(),wd=new Date(date+'T12:00:00').getDay(),o=Object.assign({},m);M.sabit.filter(x=>x&&x.og===og&&x.gun===wd&&mtTarifBul(x.rid)).forEach(x=>o[x.k]=x.rid);const f=M.fix[date+'|'+og];if(f)Object.entries(f).forEach(([k,id])=>{if(mtTarifBul(id))o[k]=id});return o}
function mtGecmisYaz(m){const M=mtM();M.hist[today()]=Object.values(m);const ks=Object.keys(M.hist).sort();while(ks.length>40)delete M.hist[ks.shift()]}
/* bugünün menüsü (gün boyunca sabit; kullanıcı değiştirince kaydedilir) → {k:id} */
function mtMenu(og,mode){const M=mtM();og=og||'aksam';mode=mode==null?(M.mode||'her'):mode;if(!M.menu||typeof M.menu!=='object'||M.menu.date!==today())M.menu={date:today()};const key=mtMenuAnahtar(og,mode);let deg=false;
 if(!M.menu[key]){const W=M.hafta&&M.hafta.days&&M.hafta.days[today()];
  if(og==='aksam'&&mode==='her'&&W)M.menu[key]=Object.assign({},W);
  else M.menu[key]=mtMenuUret(og,mode,mtTohum(gunIdx()*13+og.length*31+(MT_MODLAR.findIndex(x=>x[0]===mode)+1)*7),mtYakin(14,today()));deg=true}
 const m=M.menu[key];MT_OG[og].roller.forEach(([k])=>{if(!mtTarifBul(m[k])){const r=mtRolSec(og,k,m,mode,mtTohum(gunIdx()+k.charCodeAt(0)),mtYakin(14,today()));if(r){m[k]=r.id;deg=true}}});
 if(deg){if(og==='aksam'&&mode==='her')mtGecmisYaz(m);save()}

/* menüdeki tarifler: [[k, etiket, tarif]] */

 return {aksam:sira.map(k=>(A.find(x=>x[0]===k)||[])[2]).filter(Boolean),kahvalti:(K.find(x=>x[0]==='s')||[])[2]||null,mod:mode}}
/* bir rolü değiştir (kalıcı) */
function mtDegistir(k,og,id){const M=mtM();og=og||'aksam';const mode=M.mode||'her';mtMenu(og,mode);const key=mtMenuAnahtar(og,mode),m=M.menu[key];
 if(!id){const r=mtRolSec(og,k,m,mode,Math.random,mtYakin(14,today()));if(!r)return;id=r.id}
 m[k]=id;const fx=M.fix[today()+'|'+og];if(fx&&fx[k])delete fx[k];
 if(og==='aksam'&&mode==='her'){mtGecmisYaz(m);if(M.hafta&&M.hafta.days&&M.hafta.days[today()])M.hafta.days[today()][k]=id}save()}

/* ---------- haftalık menü ---------- */
function mtHafta(yeni){const M=mtM();let H=M.hafta;const t=today();
 if(!H||typeof H!=='object'||!H.days||yeni)H={start:t,days:{}};
 Object.keys(H.days).forEach(d=>{if(daysTo(d)<0)delete H.days[d]});
 let deg=false;const rec=d=>{const o=mtYakin(14,d);Object.entries(H.days).forEach(([g,m])=>{if(g===d)return;Object.values(m||{}).forEach(id=>o[id]=Math.min(o[id]==null?99:o[id],Math.max(1,Math.abs(daysTo(g)-daysTo(d)))))});return o};
 for(let i=0;i<7;i++){const d=addDays(t,i);if(!H.days[d]||MT_OG.aksam.roller.some(([k])=>!mtTarifBul(H.days[d][k]))){
  if(i===0&&!yeni){H.days[d]=Object.assign({},mtMenu('aksam','her'))}else H.days[d]=mtMenuUret('aksam','her',yeni?Math.random:mtTohum(gunIdx()+i*101),rec(d));deg=true}}
 if(yeni){const M2=mtM();if(M2.menu&&M2.menu.date===t)M2.menu.aksam=Object.assign({},H.days[t]);mtGecmisYaz(H.days[t])}
 H.start=t;M.hafta=H;if(deg)save();
 return Object.keys(H.days).sort().slice(0,7).map(d=>[d,mtSabitUygula(d,'aksam',H.days[d])])}

/* ---------- malzeme yazımı ve porsiyon ---------- */
const MT_TAM=['adet','diş','dilim','dal','demet','paket','avuç','damla','tane','yaprak','top'];
const mtSayiYaz=q=>q==null?'':q===0.5?'yarım':q===0.25?'çeyrek':q===0.75?'3/4':nf.format(Math.round(q*100)/100);
function mtMiktar(i,f){if(i[0]==null)return '';let q=i[0]*f;q=MT_TAM.includes(i[1])?Math.max(0.5,Math.round(q*2)/2):i[1]==='gram'?Math.max(5,Math.round(q/5)*5):Math.round(q*4)/4;if(q===0)q=0.25;return [mtSayiYaz(q),i[1]].filter(Boolean).join(' ')}
const mtMalzemeYazi=(i,f)=>[mtMiktar(i,f),i[2]].filter(Boolean).join(' ');
const mtMalzAd=s=>{s=String(s||'').replace(/\(.*?\)/g,'').replace(/^(isteğe göre|isteğe bağlı)\s+/i,'').split(/,|\sveya\s/)[0].trim();return s?bas(s):''};
const MT_LBIRIM={adet:'adet',tane:'adet',kg:'kg',gram:'gr',gr:'gr',g:'gr',demet:'demet',paket:'paket',litre:'lt',lt:'lt',ml:'ml',kutu:'kutu','şişe':'şişe',kavanoz:'kavanoz'};
function mtListeMiktar(i,f){const u=MT_LBIRIM[i[1]];if(i[0]==null||!u)return [null,''];let q=i[0]*f;if(u==='adet'||u==='demet'||u==='paket'||u==='kutu')q=Math.max(1,Math.ceil(q-0.01));else if(u==='gr'){q=Math.max(50,Math.round(q/50)*50);if(q>=1000)return [Math.round(q/100)/10,'kg']}else q=Math.round(q*100)/100;return [q,u]}
/* menü ya da tariflerin birleşik malzemeleri: [{ad, q, u, k, r:[tarif adları], durum:''|'dolap'|'temel'|'liste', metin}] */
function mtMalzemeler(tarifler){const M=mtM(),dol=new Set(mtDolap().map(norm)),lst=new Set((M.liste||[]).filter(x=>x&&!x.done).map(x=>norm(x.ad||x.t||'')));const out=new Map();
 (tarifler||[]).filter(Boolean).forEach(r=>{const f=mtPor(r)/(r.kisi||1);(r.m||[]).forEach(i=>{if(!i[3])return;const ad=mtMalzAd(i[2]);if(!ad)return;const id=norm(ad),key=norm(i[3]);
  const durum=dol.has(key)?'dolap':MT_PANTRY.has(i[3])?'temel':(lst.has(id)||lst.has(key))?'liste':'';const [q,u]=mtListeMiktar(i,f);
  if(out.has(id)){const x=out.get(id);if(q!=null&&x.q!=null&&x.u===u)x.q=Math.round((x.q+q)*100)/100;if(!x.r.includes(r.ad))x.r.push(r.ad)}
  else out.set(id,{ad,q,u,k:i[3],r:[r.ad],durum,metin:mtMalzemeYazi(i,f)})})});
 return [...out.values()]}
/* diğer bölümler için: listeye eklenecek malzeme adları (evde olanlar, temel malzemeler ve listede olanlar hariç) */
function mtEksikler(tarifler){return mtMalzemeler((tarifler||[]).map(x=>typeof x==='string'?mtTarifBul(x):x)).filter(x=>!x.durum).map(x=>x.ad)}

function mtEksikPerde(tarifler,baslik,renk){const L=mtMalzemeler(tarifler);if(!L.length){toast('Bu tarifte listeye eklenecek malzeme yok');return}
 const sec=new Set(L.map((x,i)=>x.durum?-1:i).filter(i=>i>=0));const dy={dolap:'Dolabında var',temel:'Genelde evde olur',liste:'Zaten listede'};
 const satir=(x,i)=>{const on=sec.has(i);const alt=[x.q!=null?miktarYaziMt(x):'',dy[x.durum]||'',x.r.length>1?x.r.length+' tarifte':''].filter(Boolean).join(' · ');
  return `<button type="button" class="sat mt-pk${on?'':' kapali'}" data-mti="${i}" aria-pressed="${on}"><span class="tik${on?' on':''}" aria-hidden="true">${ik('check')}</span><span class="gv"><b>${esc(x.ad)}</b>${alt?`<small>${esc(alt)}</small>`:''}</span></button>`};
 const p=perde(`<div class="pb"><h2>Eksikleri seç</h2><button type="button" class="ib2" data-kapat aria-label="Kapat">${ik('close')}</button></div><p class="mt-pac">${esc(baslik)}: evde olmayanları işaretle, yalnız onlar listeye eklenir.</p><div class="satirlar mt-pl"></div><div class="alttus"><button type="button" class="btn mt-pok"></button></div>`,{renk:renk||MT_RENK});
 const ciz=()=>{p.el.querySelector('.mt-pl').innerHTML=L.map(satir).join('');const b=p.el.querySelector('.mt-pok');b.disabled=!sec.size;b.innerHTML=sec.size?`${ik('cart')}${sec.size} ürünü listeye ekle`:'Ürün seç'};ciz();
 p.el.addEventListener('click',e=>{const t=e.target.closest('[data-mti]');if(t){const i=+t.dataset.mti;sec.has(i)?sec.delete(i):sec.add(i);ciz();return}
  if(e.target.closest('.mt-pok')&&sec.size){const n=mtListeyeYaz(L.filter((x,i)=>sec.has(i)),baslik);p.kapat();toast(n?n+' ürün alışveriş listesine eklendi':'Hepsi zaten listede')}})}

let _mtAnah=null;
function mtAnahtarlar(){if(!_mtAnah){const c={};mtYemekler().filter(r=>!MT_SAKLA.includes(r.kat)).forEach(r=>new Set(r.m.map(i=>i[3]).filter(Boolean)).forEach(k=>c[k]=(c[k]||0)+1));_mtAnah=c}return _mtAnah}
function mtGruplar(){const c=mtAnahtarlar(),G=MT_GRUP.map(([g,ks])=>[g,ks.filter(k=>c[k]).sort((a,b)=>c[b]-c[a])]),gor=new Set(G.flatMap(x=>x[1])),kal=Object.keys(c).filter(k=>!gor.has(k)).sort((a,b)=>a.localeCompare(b,'tr'));if(kal.length)G.push(['Diğer',kal]);return G.filter(g=>g[1].length)}
function mtDolapBul(q){q=trAlt(q).trim();if(!q)return [];const c=mtAnahtarlar(),nq=norm(q);return Object.keys(c).filter(k=>norm(k).includes(nq)||(MT_DSYN[k]||[]).some(s=>s.startsWith(q)||q.startsWith(s))).sort((a,b)=>(a===q?0:1)-(b===q?0:1)||(MT_PANTRY.has(a)?1:0)-(MT_PANTRY.has(b)?1:0)||(norm(a).startsWith(nq)?0:1)-(norm(b).startsWith(nq)?0:1)||c[b]-c[a])}
function mtDolapSonuc(have){const sel=[...have].filter(k=>!MT_PANTRY.has(k)),base=sel.length?sel:[...have],n=base.length,req=n>=2?2:1;
 return mtYemekler().filter(r=>!MT_SAKLA.includes(r.kat)).map(r=>{const need=[...new Set(r.m.map(i=>i[3]).filter(Boolean))],ana=need.filter(k=>!MT_PANTRY.has(k)),yard=need.filter(k=>MT_PANTRY.has(k)),hit=base.filter(k=>need.includes(k));
  return {r,hit,n,miss:ana.filter(k=>!have.has(k)),ymiss:yard.filter(k=>!have.has(k))}}).filter(x=>x.hit.length>=req&&x.miss.length<=3).sort((a,b)=>a.miss.length-b.miss.length||b.hit.length-a.hit.length||a.r.sure-b.r.sure)}

 return L.map(r=>{const ad=norm(r.ad),mz=r.m.map(i=>norm(i[2]||''));let s=0,hit=0;W.forEach(w=>{const a=ad.includes(w),m=mz.some(x=>x.includes(w));if(a||m)hit++;s+=(a?3:0)+(m?2:0)});return {r,s,hit}}).filter(x=>x.hit>0).sort((a,b)=>b.hit-a.hit||b.s-a.s||a.r.ad.localeCompare(b.r.ad,'tr')).map(x=>x.r)}

niyetKaydet({ad:'mtCorba',re:/çorba/,f:()=>{const L=mtGunSec(mtYemekler().filter(r=>r.kat==='Çorba'),3,5);return {baslik:'Sıcak bir çorba',oneriler:[...L.map(r=>mtNiyetSat(r,'Çorba')),{baslik:'Bütün çorbalar',alt:mtYemekler().filter(r=>r.kat==='Çorba').length+' tarif',ikon:'bowl',renk:MT_RENK,a:'mtGit',data:{t:'tarif',kat:'Çorba'}}]}}});
niyetKaydet({ad:'mtKahvalti',re:/kahvaltı|sabah ne ye/,f:()=>{const A=mtMenuTarifler('kahvalti','her');return {baslik:'Kahvaltı için',oneriler:[...A.map(([k,l,r])=>mtNiyetSat(r,l)),{baslik:'Kahvaltılıklar',alt:'Bütün kahvaltı tarifleri',ikon:'egg',renk:MT_RENK,a:'mtGit',data:{t:'tarif',kat:'Kahvaltı'}}]}}});

/* ---- src/bolum/plan.js ---- */
/* ===== Planım — görevler, randevular, tekrarlayan işler; Bugün · Hafta · Takvim =====
   Veri (eski sürümle aynı şekil):
   S.plan.todo    = [{id, t, date, done, kim?, saat?, _u?}]      kim: 'Ben' (varsayılan) ya da aile üyesinin adı
   S.plan.rec     = [{id, t, tip:'gun'|'hafta'|'ay', gun, saat, kim?}]   tekrarlayan görevler
   S.plan.recDone = {'YYYY-MM-DD'+recId: 1 | 'e'(ertelendi)}
   S.plan.ev      = [{id, t, date, saat, once(dk), not}]          randevular
   S.plan.aile    = ['Ben', 'Eşim', …]                             görev verilebilecek kişiler
   Diğer bölümler için: plBugunIsler(), plGorevEkle({t,date,saat,kim}), plGunOgeleri(tarih) */
const PL_RENK='#3456A8';
/* öğe türleri: [yazı, simge, renk] */
const PL_TUR={todo:['Görev','check',PL_RENK],rec:['Tekrarlayan iş','refresh','#0F8584'],ev:['Randevu','clock','#D63A63'],hatir:['Hatırlatma','bell','#9340B0'],ders:['Okul','book','#2563EB'],dini:['Dini gün','moon','#B7791F'],tatil:['Resmî tatil','sun','#0E9F6E'],ogun:['Öğün','pot','#C6531E']};
const PL_KISI_RENK=['#C6531E','#2F5FC4','#B12E62','#3A8A3E','#7B57C9','#0F8584','#B7791F','#A3243F'];
const PL_GUN_K=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const PL_ONCE=[['15','15 dk önce'],['30','30 dk önce'],['60','1 saat önce'],['120','2 saat önce'],['180','3 saat önce'],['1440','1 gün önce'],['2880','2 gün önce'],['10080','1 hafta önce']];

/* ---------- veri ---------- */
function plVeri(){const P=bolum('plan',{todo:[]});P.todo=Array.isArray(P.todo)?P.todo:[];P.rec=Array.isArray(P.rec)?P.rec:[];P.recDone=P.recDone||{};P.ev=Array.isArray(P.ev)?P.ev:[];
 P.todo.forEach(x=>{if(!x.id)x.id=uid()});return P}
const plBenMi=k=>!k||k==='Ben'||(typeof benAd==='function'&&k===benAd());
/* görev verilebilecek kişiler: Ben + plan.aile + Ailem üyeleri */
function plKisiler(){const P=plVeri();const L=[{ad:'Ben',renk:PL_RENK}];const var_=new Set(['Ben']);
 const uy=(S.ailem&&Array.isArray(S.ailem.uyeler))?S.ailem.uyeler:[];
 uy.forEach(u=>{if(u&&u.ad&&!var_.has(u.ad)){var_.add(u.ad);L.push({ad:u.ad,renk:u.renk||PL_KISI_RENK[L.length%PL_KISI_RENK.length]})}});
 (P.aile||[]).forEach(n=>{if(n&&!var_.has(n)){var_.add(n);L.push({ad:n,renk:PL_KISI_RENK[L.length%PL_KISI_RENK.length]})}});return L}
const plKisiRenk=ad=>(plKisiler().find(k=>k.ad===ad)||{renk:PL_KISI_RENK[(String(ad||'').length)%PL_KISI_RENK.length]}).renk;
const plAv=ad=>`<span class="pl-av" style="--u:${plKisiRenk(ad)}" title="${esc(ad)}">${esc(String(ad||'?')[0].toLocaleUpperCase('tr'))}</span>`;
/* tekrarlayan görev o gün var mı (eskiyle aynı kural) */
function plRecGunde(x,d){const dt=new Date((d||today())+'T12:00:00');if(x.tip==='gun')return true;if(x.tip==='hafta')return dt.getDay()===+x.gun;const son=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return dt.getDate()===Math.min(+x.gun||1,son)}
const plRecYazi=x=>x.tip==='gun'?'Her gün':x.tip==='hafta'?'Her '+GUNLER[+x.gun]:'Her ayın '+x.gun+'. günü';
const plGunAd=d=>{const n=daysTo(d);return n===0?'Bugün':n===1?'Yarın':n===-1?'Dün':tarih(d,{gun:1})};
const plSaatNorm=v=>{const m=String(v||'').match(/(\d{1,2})[:.](\d{2})/);return m&&+m[1]<24&&+m[2]<60?pad(+m[1])+':'+m[2]:''};
const plIbadetAcik=()=>typeof BOLUM!=='undefined'&&Object.values(BOLUM).some(b=>b.kat==='ibadet'&&bolumAcik(b.ad));

/* ---------- bir günün bütün öğeleri ----------
   [{tur, saat, baslik, alt, done, id, kim, a, data, href, tik:{a,data}}] — saate göre sıralı (saatsizler sonda) */
function plGunOgeleri(d,o){o=o||{};const P=plVeri(),L=[];
 P.todo.filter(x=>x.date===d).forEach(x=>L.push({tur:'todo',saat:x.saat||'',baslik:x.t,done:!!x.done,id:x.id,kim:x.kim,a:'plMenu',data:{id:x.id},tik:{a:'plTik',data:{id:x.id}},alt:''}));
 P.rec.filter(x=>plRecGunde(x,d)).forEach(x=>{const dn=P.recDone[d+x.id];L.push({tur:'rec',saat:x.saat||'',baslik:x.t,done:!!dn,id:x.id,kim:x.kim,alt:plRecYazi(x)+(dn==='e'?' · ertelendi':''),a:'plRecMenu',data:{id:x.id,d},tik:d===today()?{a:'plRecTik',data:{id:x.id}}:null})});
 P.ev.filter(e=>e.date===d).forEach(e=>L.push({tur:'ev',saat:e.saat||'',baslik:e.t,id:e.id,alt:'Randevu'+(e.not?' · '+e.not:''),a:'plEvMenu',data:{id:e.id}}));
 if(!o.hatirsiz&&typeof htGunde==='function')htGunde(d).forEach(x=>L.push({tur:'hatir',saat:'',baslik:x.ad,id:x.id,alt:'Hatırlatma'+(typeof htTurAd==='function'?' · '+htTurAd(x.kat):''),href:'#/hatir'}));
 const Ok=S.okul||{};(Ok.odev||[]).filter(x=>!x.done&&x.tarih===d).forEach(x=>L.push({tur:'ders',saat:'',baslik:(x.ders||'Ödev')+' ödevi teslim',alt:x.acik||'Okul'}));
 (Ok.sinav||[]).filter(x=>x.puan==null&&x.tarih===d).forEach(x=>L.push({tur:'ders',saat:'',baslik:(x.ders||'Ders')+' sınavı',alt:'Okul'}));
 (VERI.RESMI||[]).filter(x=>x[0]===d).forEach(x=>L.push({tur:'tatil',saat:'',baslik:x[1],alt:'Resmî tatil'}));
 if(plIbadetAcik())(VERI.DINI_ALL||[]).filter(x=>x[0]===d).forEach(x=>L.push({tur:'dini',saat:'',baslik:x[1],alt:'Dini gün'}));
 return L.sort((a,b)=>(a.saat||'99').localeCompare(b.saat||'99'))}
const plGecikenler=()=>{const t=today();return plVeri().todo.filter(x=>!x.done&&x.date&&x.date<t).sort((a,b)=>a.date.localeCompare(b.date))};

/* ---------- serbest yazıdan görev: "yarın 15:00 diş hekimi var" ---------- */
function plCoz(m){let s=' '+String(m||'').replace(/\s+/g,' ').trim()+' ';let date=null,saat='';
 const kes=(re)=>{const k=trAlt(s).match(re);if(!k)return null;const i=k.index;s=s.slice(0,i)+' '+s.slice(i+k[0].length);return k};
 let k=kes(/\s(?:saat\s*)?(\d{1,2})[:.](\d{2})(?:'?(?:de|da|te|ta|'de|'da|'te|'ta))?(?=\s)/);
 if(k&&+k[1]<24&&+k[2]<60)saat=pad(+k[1])+':'+k[2];else{k=kes(/\ssaat\s*(\d{1,2})(?:'?(?:de|da|te|ta))?(?=\s)/);if(k&&+k[1]<24)saat=pad(+k[1])+':00'}
 if(kes(/\s(?:öbür gün|ertesi gün|yarından sonra)(?=\s)/))date=addDays(today(),2);
 else if(kes(/\syarın(?:a)?(?=\s)/))date=addDays(today(),1);
 else if(kes(/\sbugün(?:e)?(?=\s)/))date=today();
 else{k=kes(/\s(pazartesi|salı|çarşamba|perşembe|cumartesi|cuma|pazar)(?:\s*günü|'?(?:ya|ye|a|e))?(?=\s)/);
  if(k){const g=['pazar','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi'].indexOf(k[1]);const fark=(g-new Date().getDay()+7)%7;date=addDays(today(),fark)}}
 let t=s.replace(/\s+/g,' ').trim();t=t.replace(/\s*(?:var|ekle|görev ekle|unutma|hatırlat)\s*[.!]?$/i,'').trim();
 return {t:bas(t),date,saat}}

/* ---------- dışarıya açık işlevler ---------- */
/* bugünün açık görevleri (gecikenler dahil, gecikmis:true ile) — kopya döner */
function plBugunIsler(){const P=plVeri(),t=today();const L=P.todo.filter(x=>!x.done&&x.date&&x.date<=t).map(x=>Object.assign({},x,{gecikmis:x.date<t}));
 P.rec.filter(x=>plRecGunde(x,t)&&!P.recDone[t+x.id]).forEach(x=>L.push({id:x.id,t:x.t,date:t,saat:x.saat||'',kim:x.kim||'Ben',done:false,rec:true}));
 return L.sort((a,b)=>(b.gecikmis?1:0)-(a.gecikmis?1:0)||(a.saat||'99').localeCompare(b.saat||'99'))}
/* görev ekle: plGorevEkle({t, date, saat, kim}) → eklenen görev (kaydedilir; ekranı çağıran yeniler) */
function plGorevEkle(o){o=o||{};const t=String(o.t||o.baslik||'').trim();if(!t)return null;const x={id:uid(),t:bas(t),date:o.date||today(),done:false,kim:o.kim||'Ben',_u:Date.now()};const s=plSaatNorm(o.saat);if(s)x.saat=s;plVeri().todo.push(x);save();return x}

/* ---------- satır parçaları ---------- */
function plAltYazi(o,gun){const p=[];if(o.saat&&!gun)p.push(o.saat);if(o.alt)p.push(esc(o.alt));if(o.kim&&!plBenMi(o.kim))p.push(`<span class="pl-kim" style="--u:${plKisiRenk(o.kim)}">${esc(o.kim)}</span>`);return p.join(' · ')}
/* liste satırı */
function plSat(o,op){op=op||{};const [ty,ic,rk]=PL_TUR[o.tur]||PL_TUR.todo;const alt=plAltYazi(o,op.saatsiz);
 const sol=o.tik?ui.tik(o.done,o.tik.a,o.tik.data,o.done?'Yapılmadı yap':'Yapıldı olarak işaretle'):`<span class="ic" style="${rv(rk)}">${ik(ic)}</span>`;
 const g=`<b>${esc(o.baslik)}</b>${alt?`<small>${alt}</small>`:''}`;
 const gv=o.a?`<button type="button" class="gv pl-gv" data-a="${o.a}"${ui.data(o.data)}>${g}</button>`:o.href?`<a class="gv pl-gv" href="${o.href}">${g}</a>`:`<span class="gv pl-gv">${g}</span>`;
 return `<div class="sat pl-s${o.done?' bitti':''}"${o.tur==='todo'&&!o.done?` data-plsw="${o.id}"`:''} style="${rv(rk)}">${sol}${gv}${op.sag||''}</div>`}
/* zaman çizelgesi */
function plAkis(L,o){o=o||{};const simdi=saatDk();let cizildi=!o.bugun;const ciz=x=>{const [ty,ic,rk]=PL_TUR[x.tur]||PL_TUR.todo;let on='';
  if(!cizildi&&x.saat&&x.saat>=simdi){cizildi=true;on=`<div class="pl-simdi"><time>${simdi}</time><i></i></div>`}
  const gec=o.bugun&&x.saat&&x.saat<simdi;const alt=plAltYazi(x,1);
  const g=`<b>${esc(x.baslik)}</b>${alt?`<small>${alt}</small>`:''}`;
  const gv=x.a?`<button type="button" class="pl-akg" data-a="${x.a}"${ui.data(x.data)}>${g}</button>`:x.href?`<a class="pl-akg" href="${x.href}">${g}</a>`:`<span class="pl-akg">${g}</span>`;
  return on+`<div class="pl-a${gec?' gec':''}${x.done?' bitti':''}" style="${rv(rk)}"><time>${x.saat||''}</time><span class="pl-n">${ik(ic)}</span><div class="pl-ak">${gv}${x.tik?ui.tik(x.done,x.tik.a,x.tik.data,'Yapıldı olarak işaretle'):''}</div></div>`};
 let h=L.map(ciz).join('');if(!cizildi)h+=`<div class="pl-simdi"><time>${simdi}</time><i></i></div>`;return `<div class="pl-akis">${h}</div>`}

/* ---------- görünüm ---------- */
function plGorunum(){const P=plVeri(),t=today(),sek=tab('plan','bugun');
 const acik=P.todo.filter(x=>!x.done&&x.date===t).length+P.rec.filter(x=>plRecGunde(x,t)&&!P.recDone[t+x.id]).length,gec=plGecikenler().length;
 const evB=P.ev.filter(e=>e.date===t).length;
 const alt=esc(uzunTarih())+' · '+(acik?acik+' açık iş':'bugün işin yok')+(evB?' · '+evB+' randevu':'');
 const ust=ui.kahraman({baslik:'Planım',ikon:'calendar',foto:fotoBolum('plan'),alt,eylemler:ui.btn('Görev ekle',{a:'plYeni',ikon:'plus',sinif:'altin'})+ui.btn('Randevu',{a:'plRandevu',ikon:'clock',sinif:'cam'})});
 const sk=ui.sekme('plan',[['bugun','Bugün'],['hafta','Hafta'],['takvim','Takvim']],sek);
 return ust+sk+(sek==='hafta'?plHafta():sek==='takvim'?plTakvim():plBugun())}

/* Bugün */
function plBugun(){const P=plVeri(),t=today(),kime=cipAl('plKime','Ben'),K=plKisiler();
 const gec=plGecikenler();
 const gecK=gec.length?`<section class="kart pl-gec"><div class="kb"><h2>${ik('alert')}${gec.length} iş gecikti</h2>${gec.length>1?`<button class="lnk" data-a="plHepsiBugune">Hepsini bugüne al</button>`:''}</div>${ui.satirlar(gec.slice(0,5).map(x=>plSat({tur:'todo',baslik:x.t,done:false,id:x.id,kim:x.kim,alt:plGunAd(x.date)+(x.saat?' '+x.saat:''),a:'plMenu',data:{id:x.id},tik:{a:'plTik',data:{id:x.id}}},{saatsiz:1,sag:`<span class="sg">${ui.btn('Bugüne al',{a:'plBugune',data:{id:x.id},sinif:'hafif kucuk'})}</span>`})))}${gec.length>5?`<p class="pl-dip">ve ${gec.length-5} iş daha</p>`:''}</section>`:'';
 const kisiC=`<div class="cipler pl-kc"><span class="pl-kcy">Kime</span>${K.map(k=>`<button type="button" class="cip${k.ad===kime?' on':''}" data-a="cip" data-k="plKime" data-v="${esc(k.ad)}">${k.ad==='Ben'?'':plAv(k.ad)}${esc(k.ad)}</button>`).join('')}<button type="button" class="cip" data-a="plKisiEkle">${ik('plus')}Kişi</button></div>`;
 const ekle=`<form class="kart pl-ek" data-form="plEkle" autocomplete="off"><div class="satgir"><input class="gir" name="t" placeholder="Ne yapılacak? Örn. yarın 15:00 diş hekimi" aria-label="Görev ekle" enterkeyhint="done"><button class="btn" aria-label="Görevi ekle">${ik('plus')}</button></div>${kisiC}<button type="button" class="pl-ayr" data-a="plYeni">${ik('edit')}Tarih, saat ve tekrar seç</button></form>`;
 const L=plGunOgeleri(t);const ozel=L.filter(o=>o.tur==='tatil'||o.tur==='dini');
 const notlar=ozel.map(o=>ui.not(esc(o.baslik),{ikon:o.tur==='tatil'?'sun':'moon'})).join('');
 const zaman=L.filter(o=>o.saat);const gun=L.filter(o=>!o.saat&&o.tur!=='tatil'&&o.tur!=='dini');
 const acik=gun.filter(o=>!o.done),bitti=gun.filter(o=>o.done);
 const isler=[...L.filter(o=>o.tur==='todo'||o.tur==='rec')],tam=isler.filter(o=>o.done).length;
 const akisK=zaman.length?ui.kart({baslik:'Zaman çizelgesi',ic:plAkis(zaman,{bugun:1})}):'';
 let gunK;
 if(!L.length&&!gec.length)gunK=ui.kart({ic:ui.bos({ikon:'calendar',baslik:'Bugün için plan yok',yazi:'Yukarıya yaz; "yarın 15:00 diş hekimi" dersen tarihi ve saati ben ayarlarım.',btn:{yazi:'Ayrıntılı görev ekle',a:'plYeni',ikon:'plus'}})});
 else if(gun.length)gunK=`<section class="kart"><div class="kb"><h2>Gün içinde</h2>${isler.length?`<span class="pl-say">${tam}/${isler.length} tamam</span>`:''}</div>${isler.length?`<div class="pl-ilr">${ui.ilerleme(isler.length?tam/isler.length*100:0)}</div>`:''}${ui.satirlar([...acik,...bitti].map(o=>plSat(o)))}</section>`;
 else gunK='';
 return gecK+ekle+notlar+akisK+gunK}

/* Hafta: önümüzdeki 7 gün */
function plHafta(){const P=plVeri(),t=today(),G=[...Array(7)].map((_,i)=>addDays(t,i));
 const gunluk=new Set(P.rec.filter(x=>x.tip==='gun').map(x=>x.id));
 const ogeler=G.map((d,i)=>plGunOgeleri(d).filter(o=>!(i>0&&o.tur==='rec'&&gunluk.has(o.id))));
 const gecmis=[...Array(7)].map((_,i)=>addDays(t,i-6));
 const tamam=P.todo.filter(x=>gecmis.includes(x.date)&&x.done).length+Object.keys(P.recDone).filter(k=>gecmis.includes(k.slice(0,10))&&P.recDone[k]===1).length;
 const acik=ogeler.reduce((s,L)=>s+L.filter(o=>(o.tur==='todo'||o.tur==='rec')&&!o.done).length,0);
 const rnd=ogeler.reduce((s,L)=>s+L.filter(o=>o.tur==='ev').length,0);
 const ozet=ui.ozet([{ikon:'checklist',deger:acik,yazi:'Bu hafta yapılacak',renk:PL_RENK},{ikon:'clock',deger:rnd,yazi:'Randevu',renk:PL_TUR.ev[2]},{ikon:'check',deger:tamam,yazi:'Son 7 günde biten',renk:'#13874F'}]);
 const serit=`<div class="pl-hs">${G.map((d,i)=>{const n=ogeler[i].filter(o=>o.tur!=='tatil'&&o.tur!=='dini').length,dt=new Date(d+'T12:00:00');return `<button type="button" class="${i===0?'on':''}${ogeler[i].some(o=>o.tur==='tatil')?' tat':''}" data-a="plGunKaydir" data-d="${d}" aria-label="${esc(tarih(d,{gun:1}))}"><small>${PL_GUN_K[dt.getDay()]}</small><b>${dt.getDate()}</b><i>${n?n:''}</i></button>`}).join('')}</div>`;
 const gunler=G.map((d,i)=>{const L=ogeler[i];const bas_=`${plGunAd(d)}${daysTo(d)<=1?` <small>${esc(tarih(d,{gun:1}))}</small>`:''}`;
  return `<section class="kart pl-gk${i===0?' bu':''}" id="pl-g-${d}"><div class="kb"><h2>${bas_}</h2>${ui.ib('plus','plYeni',{d},'Bu güne ekle')}</div>${L.length?ui.satirlar(L.map(o=>plSat(Object.assign({},o,{tik:i===0?o.tik:(o.tur==='todo'?o.tik:null)}),{sag:o.saat?`<span class="sg"><span class="pl-sc">${o.saat}</span></span>`:'',saatsiz:1}))):`<p class="pl-bosg">Boş gün</p>`}</section>`}).join('');
 const rec=P.rec.length?ui.kart({baslik:'Tekrarlayan işler',lnk:{yazi:'Ekle',a:'plYeni',data:{tekrar:'hafta'}},ic:ui.satirlar(P.rec.map(x=>ui.sat({ikon:'refresh',renk:PL_TUR.rec[2],baslik:x.t,alt:plRecYazi(x)+(x.saat?' · '+x.saat:'')+(x.kim&&!plBenMi(x.kim)?' · '+x.kim:''),a:'plRecDuz',data:{id:x.id},ok:1})))}):
  ui.kart({sinif:'ton',ic:ui.sat({ikon:'refresh',renk:PL_TUR.rec[2],baslik:'Tekrarlayan iş ekle',alt:'Çöpler, faturalar, çiçek sulama… her hafta kendiliğinden gelsin',a:'plYeni',data:{tekrar:'hafta'},ok:1})});
 return ozet+serit+gunler+rec}

/* Takvim: ay görünümü */
function plTakvim(){const t=today(),sec=tab('plGun',t),ay=tab('plAy',t.slice(0,7)),[y,m]=ay.split('-').map(Number);
 const ilk=new Date(y,m-1,1),gs=new Date(y,m,0).getDate(),bos=(ilk.getDay()+6)%7;
 let h='';for(let i=0;i<bos;i++)h+='<span></span>';
 for(let g=1;g<=gs;g++){const d=ay+'-'+pad(g),L=plGunOgeleri(d).filter(o=>!(o.tur==='rec'&&(d<t||plVeri().rec.some(r=>r.id===o.id&&r.tip==='gun')))),tur=[...new Set(L.map(o=>o.tur))].slice(0,3),tat=L.some(o=>o.tur==='tatil');

 document.addEventListener('touchstart',e=>{const r=e.target.closest('[data-plsw]');if(!r||e.target.closest('input,textarea,.tik'))return;el=r;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;kilit=0;el.style.transition='none'},{passive:true});

 bathtub:'bath',teddy:'heart',sunface:'sun',egg:'egg',school:'book',briefcase:'briefcase',stopwatch:'clock',memo:'checklist',teacup:'cup',salad:'leaf',apple:'apple',hug:'users',zzz:'bed',mosque:'mosque',drop:'drop',tropical:'sun'};

function ypSec(n,kim,o){o=o||{};const Y=ypY(),ic=o.ic!=null?o.ic:ypIcHava(),ru=o.ruh!=null?o.ruh:ypRuh(),E=ypEtk();
 const uy=(e,r)=>(!kim||e[1]===kim||(kim==='Kendine'&&e[1]==='Evde'))&&(!ic||e[2]==='ic')&&(!r||!ru||(e[6]||[]).includes(ru));
 let L=E.filter(e=>uy(e,1));if(L.length<n)L=E.filter(e=>uy(e,0));
 const off=o.off!=null?o.off:((Y.ov[today()]||{})._s||0);
 const rr=ypRnd(ypGun()*11+(ru||'').length*7+(kim||'').length*3+off*17+(o.tuz||0)),pool=L.slice(),out=[];
 while(out.length<n&&pool.length)out.push(pool.splice(Math.floor(rr()*pool.length),1)[0]);return out}
const ypEtkAlt=e=>[e[2]==='ic'?'Evde':'Dışarıda',ypSure(e[5]),e[7]?'Ücretsiz':''].filter(Boolean).join(' · ');
