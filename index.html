/* ===== Diğer araçlar · ortak yardımcılar =====
   Bütün araclar_*.js dosyaları kullanır. Hepsi fonksiyon bildirimi (hoisting) olduğu için dosya sırasından bağımsızdır. */
function arAyEkle(d,m){const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+(+m||0));return ymd(x)}
/* dönemsel kayıt {ad, ay, son}: sıradaki tarih */
function arSonraki(x){return x&&x.son?arAyEkle(x.son,x.ay):''}
function arSiklik(ay){ay=+ay||12;return ay===1?'ayda bir':ay===12?'yılda bir':ay===24?'2 yılda bir':ay+' ayda bir'}
/* durum: {n, yazi, cls: gec|yakin|iyi|bos} */
function arDurum(x,yakin){if(!x||!x.son)return {n:null,yazi:'Tarih yok',cls:'bos'};const n=daysTo(arSonraki(x));
 return n<0?{n,yazi:-n+' gün gecikti',cls:'gec'}:n===0?{n,yazi:'Bugün',cls:'gec'}:n<=(yakin||14)?{n,yazi:n+' gün kaldı',cls:'yakin'}:{n,yazi:tarih(arSonraki(x),{yil:1}),cls:'iyi'}}
const arDurumEt=d=>`<span class="ar-dur ${d.cls}">${esc(d.yazi)}</span>`;
/* dönemsel satır: dokununca düzenle, onay düğmesi "bugün yapıldı" */
function arDonemSat(x,o){const d=arDurum(x);const alt=(x.son?'Son '+tarih(x.son,{yil:1})+' · ':'')+arSiklik(x.ay)+(o.ek?' · '+o.ek:'');
 return `<div class="sat ar-ds">${o.ikon?`<span class="ic"${o.renk?` style="${rv(o.renk)}"`:''}>${ik(o.ikon)}</span>`:''}<button type="button" class="gv ar-gvb" data-a="${o.duz}" data-id="${esc(x.id)}"><b>${esc(o.baslik||x.ad)}</b><span class="ar-dsa">${arDurumEt(d)}<small>${esc(alt)}</small></span></button><span class="sg">${ui.ib('check',o.yap,{id:x.id},'Bugün yapıldı')}</span></div>`}
/* fotoğraf seç (kamera ya da galeri) → küçültülmüş jpeg */
function arResimSec(cb,max,kamera){max=max||900;const i=document.createElement('input');i.type='file';i.accept='image/*';if(kamera)i.setAttribute('capture','environment');
 i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72),im)};im.src=r.result};r.readAsDataURL(f)};i.click()}
function arResimGor(src,baslik){perde(`<div class="pb"><h2>${esc(baslik||'Görsel')}</h2><button class="ib2" data-kapat aria-label="Kapat">${ik('close')}</button></div><img class="ar-tamresim" src="${src}" alt="">`)}
/* bütçeye eklemek kullanıcının kararı */
async function arButceyeSor(baslik,tutar,kat,not){if(!(tutar>0))return;
 if(!await sor({baslik:'Bütçeye de eklensin mi?',yazi:`${baslik}: ${tl(tutar)}. İstersen bütçende “${kat}” gideri olarak kaydedeyim.`,tamam:'Bütçeye ekle',hayir:'Ekleme'}))return;
 const C=bolum('cuzdan',{tx:[],debts:[]});C.tx=C.tx||[];C.tx.push({id:uid(),type:'gider',cat:kat,amt:Math.round(tutar*100)/100,date:today(),note:not||baslik,_u:Date.now()});save();render();toast('Bütçeye eklendi')}
/* yazdır / PDF */
function arYazdir(html){let p=$('#arYazdir');if(!p){p=document.createElement('div');p.id='arYazdir';document.body.appendChild(p)}p.innerHTML=html;document.body.classList.add('ar-yaz');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('ar-yaz'),800)},120)}
function arKopyala(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kopyalandı'),()=>toast('Kopyalanamadı'))}
/* aile üyeleri (sağlık kartı, kontroller) */
function arAile(){const L=['Ben'];((S.plan&&S.plan.aile)||[]).forEach(x=>{if(x&&!L.includes(x))L.push(x)});Object.keys((S.form&&S.form.kart)||{}).forEach(k=>{if(!L.includes(k))L.push(k)});return L}
/* sekmesi seçili hâlde bir bölüme git (asistan, ana sayfa) */
eylem('arSekmeGit',d=>{if(d.k)tabAyarla(d.k,d.v);if(d.c){S.cip=S.cip||{};S.cip[d.c]=d.cv}save();git(d.h)});
function arGunKisa(d){return ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'][new Date(d+'T12:00:00').getDay()]}
const arNumara=n=>nf.format(Math.round((+n||0)*10)/10);

/* ===== Aracım =====
   Veri: S.arac = {list:[{id, ad, plaka, km, yakit:[{id,tl,lt,km,tarih}], masraf:[{id,ad,tl,tarih}], bak:[{id,ad,ay,son}]}]}
   Seçili araç: S.tabs.ark (eski sürümle aynı) */
const AR_AR_RENK='#2B4C8C';
const AR_ARB=(VERI.ARB&&VERI.ARB.length?VERI.ARB:[['Muayene',24],['Trafik sigortası',12],['Kasko',12],['Periyodik bakım',12],['Lastik değişimi (yaz/kış)',6],['MTV 1. taksit (Ocak)',12],['MTV 2. taksit (Temmuz)',12]]);
let AR_AR_HEPSI=false;
function arArE(){const A=bolum('arac',{list:[]});A.list=Array.isArray(A.list)?A.list:[];A.list.forEach(a=>{if(!a.id)a.id=uid();a.yakit=a.yakit||[];a.masraf=a.masraf||[];a.bak=a.bak||[];[...a.yakit,...a.masraf,...a.bak].forEach(x=>{if(!x.id)x.id=uid()})});return A}
function arArCur(){const A=arArE();return A.list.find(a=>a.id===tab('ark'))||A.list[0]}
function arArTuk(a){const Y=[...(a.yakit||[])].filter(y=>y.km).sort((x,y)=>x.km-y.km);if(Y.length<2)return null;const km=Y[Y.length-1].km-Y[0].km,lt=Y.slice(1).reduce((s,y)=>s+y.lt,0),t=Y.slice(1).reduce((s,y)=>s+y.tl,0);return km>0?{l100:lt/km*100,tlkm:t/km}:null}
const arArSirali=a=>[...(a.bak||[])].sort((x,y)=>(arSonraki(x)||'9').localeCompare(arSonraki(y)||'9'));
function arArIkon(ad){const s=norm(ad);return /muayene|egzoz/.test(s)?'clipboard':/sigorta|kasko/.test(s)?'shield':/mtv|vergi/.test(s)?'coin':/lastik|bakim|yag/.test(s)?'tool':'calendar'}

function arArGorunum(){const A=arArE(),a=arArCur();
 if(!a)return ui.kahraman({baslik:'Aracım',alt:'Muayene, sigorta, bakım ve yakıt takibi tek yerde.',ikon:'car',foto:fotoBolum('arac')})+
  ui.kart({ic:ui.bos({ikon:'car',baslik:'Aracını ekle',yazi:'Muayene, sigorta ve kasko tarihlerini hatırlatayım, yakıt tüketimini hesaplayayım.',btn:{yazi:'Araç ekle',a:'arArEkle',ikon:'plus'}})});
 const tk=arArTuk(a),ay=today().slice(0,7),ayM=a.yakit.filter(y=>(y.tarih||'').slice(0,7)===ay).reduce((s,y)=>s+(+y.tl||0),0)+a.masraf.filter(m=>(m.tarih||'').slice(0,7)===ay).reduce((s,m)=>s+(+m.tl||0),0);
 const B=arArSirali(a),sira=B.find(x=>x.son),tarihsiz=B.filter(x=>!x.son);
 const ust=ui.kahraman({baslik:a.ad,alt:esc([a.plaka,a.km?nf.format(a.km)+' km':''].filter(Boolean).join(' · ')||'Plaka ve kilometre ekleyebilirsin'),ikon:'car',foto:fotoBolum('arac'),
  eylemler:ui.btn('Yakıt aldım',{a:'arArYakit',ikon:'fire',sinif:'altin'})+ui.btn('Masraf ekle',{a:'arArMasraf',ikon:'wallet',sinif:'cam'})});
 const cip=`<div class="cipler">${A.list.map(x=>`<button class="cip${x.id===a.id?' on':''}" data-a="arArSec" data-v="${x.id}">${ik('car')}${esc(x.ad)}</button>`).join('')}<button class="cip" data-a="arArEkle">${ik('plus')}Araç ekle</button></div>`;
 let vurgu;
 if(sira){const d=arDurum(sira,15);vurgu=`<section class="kart vurgu ar-sira"><div class="ar-sb"><span class="ar-si">${ik(arArIkon(sira.ad))}</span><div class="ar-sy"><small>Sıradaki</small><b>${esc(sira.ad)}</b><span>${esc(d.n!=null&&d.n>15?'':d.yazi+' · ')}${esc(tarih(arSonraki(sira),{yil:1}))}</span></div></div>${ui.btn('Yaptırdım',{a:'arArBYap',data:{id:sira.id},ikon:'check',sinif:'altin kucuk'})}</section>`}
 else vurgu=`<section class="kart vurgu ar-sira"><div class="ar-sb"><span class="ar-si">${ik('calendar')}</span><div class="ar-sy"><small>Tarihleri gir</small><b>Muayene ve sigorta</b><span>En son ne zaman yapıldığını yaz, zamanı gelince hatırlatayım.</span></div></div>${tarihsiz[0]?ui.btn('Başla',{a:'arArBDuz',data:{id:tarihsiz[0].id},ikon:'arrowR',sinif:'altin kucuk'}):''}</section>`;
 const oz=ui.ozet([{ikon:'wallet',deger:tl(Math.round(ayM)),yazi:'Bu ay masraf'},{ikon:'drop',deger:tk?arNumara(tk.l100)+' L':'—',yazi:'100 km tüketim'},{ikon:'compass',deger:a.km?nf.format(a.km):'—',yazi:'Kilometre · güncelle',a:'arArKm'}]);
 const tar=ui.kart({baslik:'Tarihler',lnk:{yazi:'Ekle',a:'arArBEkle'},ic:B.length?ui.satirlar(B.map(x=>arDonemSat(x,{ikon:arArIkon(x.ad),duz:'arArBDuz',yap:'arArBYap'}))):`<p class="ac">Takip etmek istediğin tarihleri ekle.</p>`});
 const K=[...a.yakit.map(y=>({...y,k:'y'})),...a.masraf.map(m=>({...m,k:'m'}))].sort((x,y)=>(y.tarih||'').localeCompare(x.tarih||''));
 const kay=ui.kart({baslik:'Son kayıtlar'+(K.length?' · '+K.length:''),ic:K.length?ui.satirlar(K.slice(0,AR_AR_HEPSI?200:6).map(x=>ui.sat({ikon:x.k==='y'?'fire':'tool',baslik:x.k==='y'?arNumara(x.lt)+' L yakıt':x.ad,alt:tarih(x.tarih,{yil:1})+(x.km?' · '+nf.format(x.km)+' km':''),sag:`<span class="tut">${tl(x.tl)}</span>`,a:'arArKDuz',data:{k:x.k,id:x.id}})))+(K.length>6&&!AR_AR_HEPSI?ui.dahaFazla('arArHepsi'):''):
  ui.bos({ikon:'fire',baslik:'Henüz kayıt yok',yazi:'Yakıt aldığında litre, tutar ve kilometreyi yaz; tüketimi ben hesaplayayım.'})});
 return ust+(A.list.length>1?cip:'')+vurgu+oz+tar+kay+`<div class="dahafazla ar-bt" style="justify-content:center">${ui.btn('Aracı düzenle',{a:'arArDuz',ikon:'edit',sinif:'cizgi'})}${A.list.length<2?ui.btn('Başka araç',{a:'arArEkle',ikon:'plus',sinif:'cizgi'}):''}</div>`}

 kaydet:v=>{if(!(v.tl>0&&v.lt>0)){toast('Tutar ve litre yaz');return false}a.yakit.push({id:uid(),tl:v.tl,lt:v.lt,km:v.km||null,tarih:v.d||today()});if(v.km&&v.km>(a.km||0))a.km=v.km;a._u=Date.now();save();render();toast('Yakıt kaydedildi');setTimeout(()=>arButceyeSor('Yakıt',v.tl,'Ulaşım',a.ad+' yakıt'),350)}})});

 kaydet:v=>{if(!(v.tl>0)){toast('Tutar yaz');return false}const ad=String(v.ad).trim();a.masraf.push({id:uid(),ad,tl:v.tl,tarih:v.d||today()});a._u=Date.now();save();render();toast('Masraf kaydedildi');setTimeout(()=>arButceyeSor(ad,v.tl,'Ulaşım',a.ad),350)}})});
eylem('arArKDuz',d=>{const a=arArCur();if(!a)return;const k=d.k==='y'?'yakit':'masraf',x=a[k].find(z=>z.id===d.id);if(!x)return;

/* ===== Eğlence: günün kelimesi, bilgi yarışması, sudoku, hafıza, 2048 =====
   Veri (eski sürümle aynı): S.kelime = {date, guesses, done, won, stats:{played,won,streak,last}}
   S.eg = {quiz:{date,i,ans,done,best}, sudoku:{g,v,diff,sel,done}, mem:{best}, g2048:{b,score,over}, b2048}
   Günün kelimesi ve soruları eski sürümle aynı formülle seçilir (aynı gün aynı kelime). Rotalar: #/eglence, #/eglence/<oyun> */
const AR_EG_RENK='#4F46C8';
const AR_WORDS=VERI.WORDS||['KALEM'];
const AR_QZ=VERI.QZ||[];
const AR_KB=VERI.KB||[['E','R','T','Y','U','I','O','P','Ğ','Ü'],['A','S','D','F','G','H','J','K','L','Ş','İ'],['ENTER','Z','C','V','B','N','M','Ö','Ç','DEL']];
const AR_HARF=new Set(AR_KB.flat().filter(k=>k.length===1));
const AR_OYUN=[['kelime','Günün kelimesi','5 harfli kelimeyi 6 denemede bul.','book'],['quiz','Bilgi yarışması','Her gün 10 genel kültür sorusu.','trophy'],['sudoku','Sudoku','Rakamları yerleştir, zihnini dinç tut.','grid'],['hafiza','Hafıza oyunu','Eşleri en az hamlede bul.','brain'],['2048','2048','Aynı sayıları birleştir, 2048’e ulaş.','dice']];
const AR_MEM_IK=['apple','egg','fish','cheese','bread','cake','cookie','leaf','cup','bottle','pot','bowl'];
let AR_EG_YAZ='',AR_MEM=null;
const arMod=(i,n)=>((i%n)+n)%n;
function arEgGun(){const a=new Date(2026,0,1),b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function arTohum(s){let x=(s*9301+49297)%233280;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function arEgE(){const E=bolum('eg',{});E.quiz=E.quiz||{date:'',i:0,ans:[],done:false,best:0};E.mem=E.mem||{best:0};E.b2048=E.b2048||0;const K=bolum('kelime',{});K.guesses=K.guesses||[];K.stats=K.stats||{played:0,won:0,streak:0,last:''};return E}
/* ---------- kelime ---------- */
const arKelimeCevap=()=>AR_WORDS[arMod(arEgGun()*7+3,AR_WORDS.length)];
function arKelime(){arEgE();const K=S.kelime;if(K.date!==today()){K.date=today();K.guesses=[];K.done=false;K.won=false;AR_EG_YAZ=''}return K}
function arPuan(g,a){const G=[...g],A=[...a],r=Array(5).fill('x'),c={};for(let i=0;i<5;i++){if(G[i]===A[i])r[i]='g';else c[A[i]]=(c[A[i]]||0)+1}for(let i=0;i<5;i++){if(r[i]!=='g'&&c[G[i]]>0){r[i]='y';c[G[i]]--}}return r}
function arTusDurum(G,a){const st={};G.forEach(g=>{const sc=arPuan(g,a);[...g].forEach((ch,i)=>{const v=sc[i],p=st[ch];if(!p||v==='g'||(v==='y'&&p==='x'))st[ch]=v})});return st}
function arKelimeG(){const K=arKelime(),c=arKelimeCevap();let sat='';
 for(let r=0;r<6;r++){let h='';const g=K.guesses[r];if(g){const sc=arPuan(g,c);[...g].forEach((ch,i)=>h+=`<div class="ar-t ${sc[i]}">${ch}</div>`)}else if(r===K.guesses.length&&!K.done){const cs=[...AR_EG_YAZ];for(let i=0;i<5;i++)h+=`<div class="ar-t${cs[i]?' f':''}">${cs[i]||''}</div>`}else for(let i=0;i<5;i++)h+='<div class="ar-t"></div>';sat+=`<div class="ar-ts">${h}</div>`}
 const st=K.stats,ks=arTusDurum(K.guesses,c);
 const kb=AR_KB.map(row=>`<div class="ar-kr">${row.map(k=>k==='ENTER'?`<button class="ar-k gen" data-a="arKTus" data-k="ENTER">Gir</button>`:k==='DEL'?`<button class="ar-k gen" data-a="arKTus" data-k="DEL" aria-label="Harf sil">${ik('chevL')}</button>`:`<button class="ar-k ${ks[k]||''}" data-a="arKTus" data-k="${k}">${k}</button>`).join('')}</div>`).join('');
 const son=`<section class="kart vurgu ar-egson"><h2>${K.won?'Tebrikler!':'Bu sefer olmadı'}</h2><p>Günün kelimesi: <b>${c}</b></p>${ui.ozet([{ikon:'game',deger:st.played,yazi:'Oynanan'},{ikon:'trophy',deger:'%'+(st.played?Math.round(st.won/st.played*100):0),yazi:'Kazanma'},{ikon:'fire',deger:st.streak,yazi:'Seri'}])}${ui.btn('Sonucu paylaş',{a:'arKPay',ikon:'share',sinif:'altin genis'})}<small>Yarın yeni kelime seni bekliyor.</small></section>`;
 return `<p class="ar-ipucu"><i class="g"></i>doğru yerde <i class="y"></i>var ama yeri yanlış <i class="x"></i>yok</p><div class="ar-tahta">${sat}</div>${K.done?son:`<div class="ar-klavye">${kb}</div>`}`}
function arKBas(k){const K=arKelime();if(K.done)return;const L=[...AR_EG_YAZ];
 if(k==='DEL')AR_EG_YAZ=L.slice(0,-1).join('');
 else if(k==='ENTER'){if(L.length<5){toast('5 harf yazmalısın');return}K.guesses.push(AR_EG_YAZ);const won=AR_EG_YAZ===arKelimeCevap();AR_EG_YAZ='';
  if(won||K.guesses.length>=6){K.done=true;K.won=won;const st=K.stats;st.played++;if(won){st.won++;st.streak=st.last===addDays(today(),-1)&&st.streak>0?st.streak+1:1}else st.streak=0;st.last=today();toast(won?'Bildin!':'Günün kelimesi: '+arKelimeCevap())}save()}
 else if(L.length<5&&AR_HARF.has(k))AR_EG_YAZ+=k;render()}
eylem('arKTus',d=>arKBas(d.k));
eylem('arKPay',()=>{const K=arKelime(),c=arKelimeCevap(),g=K.guesses.map(x=>arPuan(x,c).map(v=>v==='g'?'🟩':v==='y'?'🟨':'⬜').join('')).join('\n');waPaylas(`BUGÜNÜM Kelime #${arEgGun()+1} · ${K.won?K.guesses.length:'X'}/6\n\n${g}`)});
/* ---------- yarışma ---------- */
function arQuiz(){const Z=arEgE().quiz;if(Z.date!==today()){Z.date=today();Z.i=0;Z.ans=[];Z.done=false}return Z}
function arQzSet(){const r=arTohum(arEgGun()+101),ix=AR_QZ.map((_,i)=>i);for(let i=ix.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]]}return ix.slice(0,10)}
function arQzSec(qi){const r=arTohum(arEgGun()*13+qi+7),o=[...AR_QZ[qi][1]];for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}

 return `<div class="ar-qzu"><div class="ar-seg">${['kolay','orta','zor'].map(d=>`<button type="button" class="${Z.diff===d?'on':''}" data-a="arSdkYeni" data-v="${d}">${bas(d)}</button>`).join('')}</div><span>${bos} boş</span></div>
 <div class="ar-sdk">${Z.v.map((n,p)=>{const r=Math.floor(p/9),c=p%9,sel=p===Z.sel,ayni=sn&&n===sn,ilg=Z.sel>=0&&(Math.floor(Z.sel/9)===r||Z.sel%9===c);return `<button type="button" data-a="arSdkSec" data-i="${p}" class="${Z.g[p]?'v':''}${bad.has(p)?' hata':''}${sel?' sec':ayni?' ayni':ilg?' ilg':''}${c%3===2&&c<8?' sg':''}${r%3===2&&r<8?' ab':''}" aria-label="Satır ${r+1} sütun ${c+1}${n?' '+n:' boş'}">${n||''}</button>`}).join('')}</div>
 ${Z.done?`<section class="kart vurgu ar-egson"><h2>Tebrikler, çözdün!</h2>${ui.btn('Yeni oyun',{a:'arSdkYeni',data:{v:Z.diff},ikon:'refresh',sinif:'altin genis'})}</section>`:`<div class="ar-num">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-a="arSdkNum" data-n="${n}">${n}</button>`).join('')}<button type="button" data-a="arSdkNum" data-n="0" aria-label="Sil">${ik('trash')}</button></div>`}`}

 for(let i=0;i<4;i++){const ix=[];for(let j=0;j<4;j++)ix.push(yon==='L'?i*4+j:yon==='R'?i*4+3-j:yon==='U'?j*4+i:(3-j)*4+i);const v=ix.map(k=>b[k]).filter(Boolean),o=[];for(let k=0;k<v.length;k++){if(v[k]===v[k+1]){o.push(v[k]*2);kaz+=v[k]*2;k++}else o.push(v[k])}while(o.length<4)o.push(0);ix.forEach((k,j)=>{if(b[k]!==o[j]){oynadi=true;b[k]=o[j]}})}
 if(oynadi){G.score+=kaz;ar2Ekle(b);if(G.score>E.b2048)E.b2048=G.score;if(!ar2Olur(b))G.over=true;save();render()}}

   İçerik: VERI.PRATIK [{id, k, t, s:[adımlar], u:uyarı, e:[anahtar kelimeler]}], VERI.PRK kategoriler.
   Veri (eski sürümle aynı): S.pratik = {kat, fav:[id]} · Rotalar: #/pratik, #/pratik/<kategori>, #/pratik/fav */
const AR_PR_RENK='#B7791F';
const AR_PR=(VERI.PRATIK||[]).map((x,i)=>Object.assign({id:'p'+i},x));
const AR_PRK=VERI.PRK||[];
const AR_PR_IK={leke:'spray',camasir:'shirt',temizlik:'broom',mutfak:'pot',saklama:'jar',koku:'leaf',tamir:'tool',tasarruf:'coin',bitki:'plant',hasere:'shield',ilkyardim:'pulse',cocuk:'baby',teknoloji:'phone',seyahat:'compass',arac:'car'};
const AR_PR_ILK='Bu bilgiler genel bilgilendirme içindir; tıbbi tavsiye ya da tedavi yerine geçmez. Acil durumda <a href="tel:112"><b>112</b></a>’yi ara. Zehirlenmelerde Ulusal Zehir Danışma Merkezi: <a href="tel:114"><b>114</b></a>.';
let AR_PR_ARA='';

const arPrKat=k=>AR_PRK.find(x=>x[0]===k)||[k,k];
function arPrBul(q){const s=norm(q.trim());if(s.length<2)return [];return AR_PR.filter(x=>norm(x.t+' '+(x.e||[]).join(' ')+' '+x.s.join(' ')).includes(s)).sort((a,b)=>(norm(b.t).includes(s)?1:0)-(norm(a.t).includes(s)?1:0))}
const arPrSat=x=>ui.sat({sar:1,ikon:AR_PR_IK[x.k]||'bulb',baslik:x.t,alt:arPrKat(x.k)[1]+' · '+x.s.length+' adım',a:'arPrAc',data:{id:x.id},ok:1});

function arPrGorunum(p){const P=arPrE(),kat=p[0]||'',q=AR_PR_ARA;
 const ara=ui.ara('arPrAra',q,'Ara: çay lekesi, yanık, nem…');
 if(kat){const K=kat==='fav'?['fav','Kaydettiklerim']:arPrKat(kat),L=kat==='fav'?AR_PR.filter(x=>P.fav.includes(x.id)):AR_PR.filter(x=>x.k===kat);
  return ui.kahraman({baslik:K[1],alt:L.length+' bilgi',ikon:kat==='fav'?'heart':AR_PR_IK[kat]||'bulb',foto:fotoBolum('pratik'),yol:'<a href="#/pratik">Pratik bilgiler</a> ›'})+(kat==='ilkyardim'?ui.not(AR_PR_ILK,{uyari:1,ikon:'alert'}):'')+
   ui.kart({ic:L.length?ui.satirlar(L.map(arPrSat)):ui.bos({ikon:'heart',baslik:'Henüz kaydettiğin yok',yazi:'Beğendiğin bilgilerde “Kaydet”e dokun, burada toplansın.'})})}
 const ust=ui.kahraman({baslik:'Pratik bilgiler',alt:`${AR_PR.length} püf noktası: leke, temizlik, ilk yardım ve daha fazlası.`,ikon:'bulb',foto:fotoBolum('pratik')});
 if(q.trim().length>=2){const L=arPrBul(q);return ust+ara+ui.kart({baslik:L.length?L.length+' sonuç':'',ic:L.length?ui.satirlar(L.slice(0,40).map(arPrSat)):ui.bos({ikon:'search',baslik:'Sonuç yok',yazi:'Başka bir kelime dene: “çay lekesi”, “yanık”, “nem”…'})})}
 const g=AR_PR[Math.floor(Date.now()/864e5)%AR_PR.length];
 const gun=g?`<section class="kart vurgu ar-gun"><small>Günün pratik bilgisi · ${esc(arPrKat(g.k)[1])}</small><h2>${esc(g.t)}</h2><p>${esc(g.s[0])}</p>${ui.btn('Adımları gör',{a:'arPrAc',data:{id:g.id},ikon:'arrowR',sinif:'altin kucuk'})}</section>`:'';
 const kat2=`<div class="ar-katlar">${AR_PRK.map(([k,y])=>`<a href="#/pratik/${k}" class="ar-kat"><span class="ic">${ik(AR_PR_IK[k]||'bulb')}</span><b>${esc(y)}</b><small>${AR_PR.filter(x=>x.k===k).length} bilgi</small></a>`).join('')}</div>`;
 const fav=P.fav.length?ui.kart({ic:ui.satirlar([ui.sat({ikon:'heart',baslik:'Kaydettiklerim',alt:P.fav.length+' bilgi',href:'#/pratik/fav',ok:1})])}):'';
 return ust+ara+gun+fav+`<div class="ar-baslik"><h2>Kategoriler</h2></div>`+kat2+ui.not('Kimyasalları asla birbirine karıştırma; yeni bir yöntemi önce görünmeyen küçük bir alanda dene.',{uyari:1})}

 <ol class="ar-adim">${x.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${x.u?ui.not('<b>Dikkat:</b> '+esc(x.u),{uyari:1}):''}${x.k==='ilkyardim'?ui.not(AR_PR_ILK,{uyari:1,ikon:'alert'}):''}
 <div class="ar-bt ar-bt2">${ui.btn(fav?'Kaydedildi':'Kaydet',{a:'arPrFav',data:{id:x.id},ikon:'heart',sinif:fav?'hafif':''})}${ui.btn('Paylaş',{a:'arPrPay',data:{id:x.id},ikon:'share',sinif:'cizgi'})}</div>`,{renk:AR_PR_RENK})});

 const w=norm(s).split(/\s+/).filter(x=>x.length>2&&!['nasil','cikar','icin','gibi','olan','yapilir'].includes(x));let L=[];for(let n=w.length;n>0&&!L.length;n--)L=arPrBul(w.slice(0,n).join(' '));if(!L.length)L=w.map(x=>arPrBul(x)).flat();

 return {baslik:'Pratik bilgiler',ac:ilk?'Acil durumda 112’yi ara. Bilgiler tıbbi tavsiye yerine geçmez.':'',oneriler:[...L.map(x=>({baslik:x.t,alt:arPrKat(x.k)[1],ikon:AR_PR_IK[x.k]||'bulb',renk:AR_PR_RENK,a:'arPrAc',data:{id:x.id}})),{baslik:'Tüm pratik bilgiler',alt:AR_PR.length+' püf noktası',ikon:'bulb',renk:AR_PR_RENK,href:'#/pratik'}]}}});

/* ---- src/bolum/araclar_saglik.js ---- */
/* ===== Sağlık ve yaşam =====
   Veri (eski sürümle aynı, S.form):
   weights:[{id,date,kg}] · meals:[{id,ogun,text,date}] · water:{tarih:bardak} · waterGoal · goal (dokunulmaz)
   ilac:[{id,ad,doz,saatler:['08:00'],stok?,adet?,stokT?}] · ilacLog:{tarih:{'id@08:00':true}}
   olcum:[{id,ts,tur,v1,v2}] · uyku:[{id,date,yat,kalk,min}] · kart:{kişi:{kan,dt,alerji,kronik,ilac,dr,acil,acilTel,not}} · kont:[{id,tur,ad,kim,ay,son}]
   Bilgi amaçlıdır: teşhis, tedavi, diyet ya da kalori hedefi yok. */
const AR_SG_RENK='#0F8584';
const AR_SU_RENK='#1B8EC2';
const AR_OGUN=VERI.OGUN||['Kahvaltı','Ara öğün (sabah)','Öğle','Ara öğün (ikindi)','Akşam','Gece'];
const AR_OLC=VERI.OLC||{Tansiyon:['mmHg',1],Nabız:['atım/dk',0],Şeker:['mg/dL',0],Ateş:['°C',0]};
const AR_KONT=VERI.KONT||[['genel','Genel check-up',12],['dis','Diş hekimi kontrolü',6],['goz','Göz kontrolü',12],['kadin','Kadın doğum kontrolü',12],['cocuk','Çocuk doktoru kontrolü',6],['kan','Kan tahlili',12],['diger','Diğer kontrol',12]];
const AR_KANG=VERI.KANG||['Bilmiyorum','0 Rh+','0 Rh−','A Rh+','A Rh−','B Rh+','B Rh−','AB Rh+','AB Rh−'];
const AR_SG_NOT='Bu bölüm kayıt tutmak içindir; bilgi amaçlıdır, teşhis ve tedavi yerine geçmez. Doktorunun önerisine uy.';
function arSgE(){const F=bolum('form',{});F.weights=F.weights||[];F.meals=F.meals||[];F.water=F.water||{};F.waterGoal=F.waterGoal||8;F.ilac=F.ilac||[];F.ilacLog=F.ilacLog||{};F.olcum=F.olcum||[];F.uyku=F.uyku||[];F.kart=F.kart||{};F.kont=F.kont||[];
 F.ilac.forEach(m=>{if(!m.id)m.id=uid();m.saatler=m.saatler||[]});return F}
const arSure=m=>{m=Math.max(0,Math.round(m));return m<60?m+' dk':Math.floor(m/60)+' sa'+(m%60?' '+(m%60)+' dk':'')};
const arSaat=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const arOlcYaz=x=>x.tur==='Tansiyon'?`${x.v1}/${x.v2}`:arNumara(x.v1);
function arIlacKalan(m){if(m.stok==null||m.stok==='')return null;const F=arSgE();let n=0;Object.entries(F.ilacLog).forEach(([d,o])=>{if(d>=(m.stokT||'0'))Object.entries(o||{}).forEach(([k,v])=>{if(v&&k.startsWith(m.id+'@'))n++})});const kalan=Math.max(0,m.stok-n*(m.adet||1)),gun=m.saatler.length?Math.floor(kalan/(m.saatler.length*(m.adet||1))):null;return {kalan,gun}}
function arDozlar(){const F=arSgE(),log=F.ilacLog[today()]||{},D=[];F.ilac.forEach(m=>m.saatler.forEach(s=>D.push({m,s,k:m.id+'@'+s,ok:!!log[m.id+'@'+s]})));return D.sort((a,b)=>a.s.localeCompare(b.s))}
function arDozSat(d){const gec=!d.ok&&d.s<=saatDk();return `<div class="sat ar-doz${d.ok?' bitti':''}">${ui.tik(d.ok,'arSgDoz',{k:d.k},d.ok?'Alınmadı yap':'Aldım')}<button type="button" class="gv ar-gvb" data-a="arSgDoz" data-k="${esc(d.k)}"><b>${esc(d.m.ad)}</b><small>${esc(d.m.doz||'Doz yazılmadı')}${gec?' · saati geçti':''}</small></button><span class="sg"><span class="ar-saat${gec?' gec':''}">${d.s}</span></span></div>`}

/* ---------- görünüm ---------- */
function arSgGorunum(){const F=arSgE(),t=tab('saglik','bugun');
 const ey={ilac:ui.btn('İlaç ekle',{a:'arSgIlac',ikon:'plus',sinif:'altin'}),olcum:{olc:ui.btn('Ölçüm ekle',{a:'arSgOlcEkle',ikon:'plus',sinif:'altin'}),uyku:ui.btn('Uyku ekle',{a:'arSgUyku',ikon:'plus',sinif:'altin'})}[cipAl('arSgOlc','kilo')]||'',kart:''}[t]||'';
 const ust=ui.kahraman({baslik:'Sağlık ve yaşam',alt:'Su, ilaç, ölçüm ve uyku kayıtların tek yerde.',ikon:'heart',foto:fotoBolum('saglik'),eylemler:ey});
 const sek=ui.sekme('saglik',[['bugun','Bugün'],['ilac','İlaçlar'],['olcum','Ölçümler'],['kart','Kartım']],t);
 const g=t==='ilac'?arSgIlacG():t==='olcum'?arSgOlcG():t==='kart'?arSgKartG():arSgBugunG();
 return ust+sek+g+ui.not(AR_SG_NOT)}

function arSgSuKart(){const F=arSgE(),n=F.water[today()]||0,g=F.waterGoal||8,p=Math.min(100,n/g*100);
 const gun=[];for(let i=6;i>=0;i--){const d=addDays(today(),-i);gun.push([d,F.water[d]||0])}const mx=Math.max(g,...gun.map(x=>x[1]));
 const bar=gun.map(([d,v])=>{const h=Math.max(4,Math.round(v/mx*44));return `<div title="${esc(tarih(d,{gun:1}))}: ${v} bardak"><i style="height:${h}px" class="${v>=g?'tam':''}"></i><small>${arGunKisa(d)}</small></div>`}).join('');
 return `<section class="kart vurgu ar-su" style="${rv(AR_SU_RENK)}"><div class="ar-sut"><div class="ar-halka" style="--p:${p}"><div><b>${n}</b><small>/ ${g} bardak</small></div></div><div class="ar-sud"><small>Bugün su</small><b>${n>=g?'Hedef tamam':g-n+' bardak kaldı'}</b><div class="ar-sudb">${ui.btn('',{a:'arSgSu',data:{d:-1},ikon:'minus',sinif:'cam',aria:'Bir bardak çıkar'})}${ui.btn('1 bardak',{a:'arSgSu',data:{d:1},ikon:'plus',sinif:'altin'})}</div></div></div>
 <div class="ar-hafta">${bar}</div><button type="button" class="ar-hedef" data-a="arSgSuHedef">Günlük hedef: ${g} bardak · değiştir</button></section>`}

function arSgBugunG(){const F=arSgE(),t=today(),D=arDozlar();
 const W=[...F.weights].sort((a,b)=>a.date.localeCompare(b.date)),sk=W[W.length-1];

/* ===== Namaz vakitleri (İbadet · isteğe bağlı, varsayılan kapalı) =====
   Vakitler eski sürümdeki gibi cihazda hesaplanır (internet gerekmez; Diyanet ile 1–2 dk fark olabilir).
   Şehir: S.gunluk (hava durumuyla ortak) · namaz takibi: S.ntakip = {tarih:{f,z,a,s,i}} (eski sürümle aynı) · sekme: S.tabs.vakit
   Başka hiçbir bölüme karışmaz; ana sayfa kartında yalnız açıksa sıradaki vakit görünür. */
const AR_VK_RENK='#8E6A2B';

const AR_NVK=VERI.NVK||[['f','Sabah'],['z','Öğle'],['a','İkindi'],['s','Akşam'],['i','Yatsı']];
const AR_VK_IK={f:'moon',r:'sun',z:'sun',a:'suncloud',s:'sun',i:'moon'};
let AR_VK_SAYAC=0,AR_VK_YON=null;
/* eski sürümde açtıysa (S.din) açık gelsin */
if(S.din===true){S.araclar=S.araclar||{};if(S.araclar.vakit==null)S.araclar.vakit=1}
function arVakitHesap(date,lat,lng,tz){
 const D=Math.PI/180,R=180/Math.PI,fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a},sn=x=>Math.sin(x*D),cs=x=>Math.cos(x*D),tn=x=>Math.tan(x*D),as=x=>R*Math.asin(x),ac=x=>R*Math.acos(Math.max(-1,Math.min(1,x))),at2=(y,x)=>R*Math.atan2(y,x),acot=x=>R*Math.atan(1/x);
 let Y=date.getFullYear(),M=date.getMonth()+1;const d=date.getDate();if(M<=2){Y-=1;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
 const JD=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5-lng/(15*24);
 const gun=jd=>{const Dd=jd-2451545,g=fix(357.529+0.98560028*Dd,360),q=fix(280.459+0.98564736*Dd,360),L=fix(q+1.915*sn(g)+0.020*sn(2*g),360),e=23.439-0.00000036*Dd,RA=fix(at2(cs(e)*sn(L),cs(L))/15,24);return{dec:as(sn(e)*sn(L)),eqt:q/15-RA}};
 const ort=t=>fix(12-gun(JD+t).eqt,24);
 const aci=(a,t,ccw)=>{const s=gun(JD+t),T=ac((-sn(a)-sn(s.dec)*sn(lat))/(cs(s.dec)*cs(lat)))/15;return ort(t)+(ccw?-T:T)};
 const asr=t=>{const dec=gun(JD+t).dec;return aci(-acot(1+tn(Math.abs(lat-dec))),t)};
 let t={f:5,r:6,z:12,a:13,s:18,i:18};
 for(let k=0;k<2;k++){const p={};for(const x in t)p[x]=t[x]/24;t={f:aci(18,p.f,1),r:aci(0.833,p.r,1),z:ort(p.z),a:asr(p.a),s:aci(0.833,p.s),i:aci(17,p.i)}}
 const adj={f:0,r:-7,z:5,a:4,s:7,i:0},o={};for(const x in t)o[x]=fix(t[x]+tz-lng/15+adj[x]/60,24);return o}
const arSaatYaz=h=>{const m=Math.round(h*60);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
function arVakitler(dt){const c=sehir();return arVakitHesap(dt||new Date(),c.lat,c.lng,3)}
function arSiradaki(){const now=new Date(),T=arVakitler(now),nm=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;for(const [k,l] of AR_VAKIT){if(T[k]>nm)return{k,l,at:new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,Math.round(T[k]*60))}}
 const tm=new Date(now);tm.setDate(tm.getDate()+1);const T2=arVakitler(tm);return{k:'f',l:'İmsak',at:new Date(tm.getFullYear(),tm.getMonth(),tm.getDate(),0,Math.round(T2.f*60))}}
const arGeriSay=ms=>{const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const arKalanYaz=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m<60?m+' dk':Math.floor(m/60)+' sa'+(m%60?' '+m%60+' dk':'')};
function arKible(lat,lng){const D=Math.PI/180,f1=lat*D,f2=21.4225*D,dl=(39.8262-lng)*D;return (Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))/D+360)%360}

 else{const N=arNTakip(),o=N[today()]||{},n=AR_NVK.filter(([k])=>o[k]).length,sr=arNSeri(),w=[...Array(7)].map((_,i)=>addDays(today(),i-6));

   <div class="ar-hafta">${w.map(x=>{const c2=AR_NVK.filter(([k])=>(N[x]||{})[k]).length;return `<div title="${esc(tarih(x))}: ${c2}/5"><i style="height:${Math.max(4,c2/5*40)}px" class="${c2===5?'tam':''}"></i><small>${arGunKisa(x)}</small></div>`}).join('')}</div><p class="ac" style="margin:8px 0 0">Bu bilgi yalnızca telefonunda kalır.</p></section>`;
  g=vk+tk+ui.not('Vakitler hesaplanarak bulunur; Diyanet takvimiyle 1–2 dakika fark olabilir.')}

const OSRC={liste:()=>S.mutfak&&S.mutfak.liste,gorev:()=>S.plan&&S.plan.todo,takvim:()=>S.hatir&&S.hatir.items,pano:()=>S.ailem&&S.ailem.notlar,ev:()=>S.cuzdan&&(S.cuzdan.tx||[]).filter(x=>x&&x.alan==='ev')};

 a.forEach(x=>{if(!x||x.id==null)return;const r=Object.assign({},x);delete r._u;const h=blHash(JSON.stringify(r));if(m[x.id]!==h){if(touch&&!ilk)x._u=now;m[x.id]=h}})}

/* ===== Bütçe — gelir, gider, ödemeler, Ev Bütçesi, harçlık ve takı defterleri =====
   Eski "Bütçe Merkezi" (cuzdan), "Harçlık Defteri" ve "Takı & Hediye Defteri" tek bölümde.
   Veri (eski sürümle AYNI şekil; yalnız yeni alanlar eklendi):
   S.cuzdan = {tx:[{id,type:'gelir'|'gider',cat,amt,date,note,borcId?, alan?:'kisisel'|'ev', kim?, duz?}],
               debts:[{id,dir:'alacak',who,amt,due,note,paid}],             (borçlar eski göçle borc'a taşınmış)
               borc:[{id,ad,tur:'tek'|'taksit',tutar,toplam?,n,due,paid:[{i,date,tx}],cat?}],
               duz:[{id,type,ad,amt,cat,gun,bas, alan?}], duzOk:{'<id>_<yyyy-mm>':1},
               limit:{kategori:tutar}, hedef:[{id,ad,tutar,tarih,biri}],
               varsayilanAlan?, evLimit?, sonKat?}                         (son üçü yeni)
   S.harc  = {cocuk:[{id,ad}], k:[{id,kid,tip:'ver'|'harca'|'ekle',tutar,not,tarih}], ayar:{kid:{tutar,per,bas,son,hedef:{ad,tutar}}}}
   S.hatir.defter = [{id,yon:'gelen'|'giden',kim,olay,tarih,tur:'altin'|'doviz'|'tl'|'esya',alt?,dov?,miktar,aciklama,tlO,kaynak,kur?,kurTarih?,not,ts,dz?}]
   S.kur   = {usd,eur,gbp,gram,ceyrek,src,ts,elle:{gram,ceyrek,usd,eur}}
   Kural: bütçeden düşülecek tutara kullanıcı karar verir — hiçbir ödeme kendiliğinden gidere yazılmaz. */
const BT_RENK='#0E7C5A';
const BT_GIDER=[['Market','cart','#1F9D68'],['Fatura','bulb','#D08A06'],['Kira','home','#6D45C9'],['Ulaşım','car','#0E8FB0'],['Yemek','utensils','#DE5440'],['Sağlık','pulse','#D43F72'],['Eğitim','book','#2563EB'],['Giyim','shirt','#B52A6E'],['Çocuk','baby','#DB7A0C'],['Eğlence','film','#7C4DDB'],['Abonelik','phone','#0284C7'],['Kredi','card','#56657A'],['Diğer','bag','#7A8597']];
const BT_GELIR=[['Maaş','wallet','#0E7C5A'],['Ek gelir','coin','#15803D'],['Kira geliri','home','#6D45C9'],['Emekli maaşı','user','#0F766E'],['Diğer','spark','#7A8597']];

let btAy=null,btQ='',btTakiQ='',btTumKat=false;

/* ---------- yardımcılar ---------- */
const btNf0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const btNf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const btTL=n=>{n=Math.round((+n||0)*100)/100;const a=Math.abs(n);return (n<0?'−':'')+(Number.isInteger(a)?btNf0:btNf2).format(a)+' ₺'};
const btTL0=n=>(n<0?'−':'')+btNf0.format(Math.abs(Math.round(+n||0)))+' ₺';
const btKisa=(n,y)=>{const a=Math.abs(+n||0),e=n<0?'−':'',t=y?'':' ₺';return a>=1e6?e+btNfx(a/1e6,1)+' mn'+t:a>=1e4?e+btNfx(a/1e3,1)+' bin'+t:e+btNf0.format(Math.round(a))+' ₺'};
const btAyOf=d=>String(d||'').slice(0,7);

/* ay ekle (gün ayın sonuna sığdırılır) */
function btAyEkle(s,n){const [y,m,g]=s.split('-').map(Number);const d=new Date(y,m-1+n,1);const son=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(g,son));return ymd(d)}
const btGunYazi=n=>n<0?(-n)+' gün gecikti':n===0?'bugün':n===1?'yarın':n+' gün sonra';
const btBen=()=>typeof benAd==='function'?benAd():(((S.name||'').trim().split(/\s+/)[0])||'Ben');

function btKat(ad,tip){const L=tip==='gelir'?BT_GELIR:BT_GIDER;const k=L.find(x=>x[0]===ad);if(k)return k;if(BT_EK[ad])return [ad,BT_EK[ad][0],BT_EK[ad][1]];return [ad||'Diğer',tip==='gelir'?'spark':'bag','#7A8597']}

/* ---------- veri ---------- */
function btC(){const C=bolum('cuzdan',{tx:[],debts:[]});C.tx=Array.isArray(C.tx)?C.tx:[];C.debts=Array.isArray(C.debts)?C.debts:[];C.limit=C.limit||{};C.duz=C.duz||[];C.hedef=C.hedef||[];C.duzOk=C.duzOk||{};
 /* eski sürümdeki göç: ödenmemiş "borcum var" kayıtları borç listesine */
 if(!C.borc){C.borc=[];C.debts.filter(d=>d.dir==='borc'&&!d.paid).forEach(d=>C.borc.push({id:d.id||uid(),ad:d.who,tur:'tek',tutar:d.amt,n:1,due:d.due||today(),paid:[]}));C.debts=C.debts.filter(d=>d.dir!=='borc')}
 C.borc.forEach(b=>{b.paid=b.paid||[];b.n=b.n||1});C.tx.forEach(t=>{if(!t.id)t.id=uid()});return C}
const btBNext=b=>b.paid.length<b.n?{i:b.paid.length,d:b.paid.length===0?b.due:btAyEkle(b.due,b.paid.length)}:null;
const btBKalan=b=>(b.n-b.paid.length)*b.tutar;
const btAyTx=ay=>btC().tx.filter(t=>btAyOf(t.date)===ay);

/* ---------- dışarıya açık fonksiyonlar ---------- */
/* btAyOzeti('2026-10') → {gelir, gider, kalan} */
function btAyOzeti(ay){ay=ay||btBuAy();let g=0,d=0;btAyTx(ay).forEach(t=>{if(t.type==='gelir')g+=+t.amt||0;else d+=+t.amt||0});return {gelir:g,gider:d,kalan:g-d}}
/* btEvIslemleri(ay) → bu ayın Ev (ortak) alanlı gider işlemleri */
function btEvIslemleri(ay){ay=ay||btBuAy();return btAyTx(ay).filter(t=>t.type==='gider'&&t.alan==='ev').sort((a,b)=>b.date.localeCompare(a.date))}
/* btYaklasanOdemeler(gun) → [{baslik, tutar, tarih, kalan, id}] — gecikenler dahil, tarihe göre */
function btYaklasanOdemeler(gun){gun=gun==null?30:gun;const C=btC(),R=[];
 C.borc.forEach(b=>{const x=btBNext(b);if(!x)return;const k=daysTo(x.d);if(k<=gun)R.push({id:'b:'+b.id,tur:'borc',baslik:b.ad+(b.tur==='taksit'||b.n>1?` · ${x.i+1}/${b.n}. taksit`:''),ad:b.ad,ek:b.n>1?`${x.i+1}/${b.n}`:'',tutar:b.tutar,tarih:x.d,kalan:k,ref:b})});
 const bu=btBuAy();C.duz.filter(d=>d.type!=='gelir').forEach(d=>{for(const ay of [bu,btAyKay(bu,1)]){const t=btDuzTarih(d,ay);if(C.duzOk[d.id+'_'+ay]||(d.bas&&t<d.bas))continue;const k=daysTo(t);if(k<=gun&&(ay===bu||k>=0))R.push({id:'d:'+d.id+':'+ay,tur:'duz',baslik:d.ad,tutar:d.amt,tarih:t,kalan:k,ref:d,ay});break}});
 return R.sort((a,b)=>a.tarih.localeCompare(b.tarih))}
function btDuzTarih(d,ay){const son=new Date(+ay.slice(0,4),+ay.slice(5),0).getDate();return ay+'-'+pad(Math.min(d.gun||1,son))}
/* btEvOzeti(ay) → Ailem sayfasının kullandığı Ev Bütçesi kartı (HTML) */
function btEvOzeti(ay){ay=ay||btBuAy();const C=btC(),L=btEvIslemleri(ay),top=L.reduce((s,t)=>s+(+t.amt||0),0),lim=+C.evLimit||0;
 const bas=`<div class="bt-evb"><span class="bt-evi">${ik('home')}</span><span class="gv"><b>Ev bütçesi</b><small>${esc(btAyYazi(ay))} · ortak harcamalar</small></span><a class="lnk" href="#/butce">Bütçe</a></div>`;
 if(!L.length)return `<section class="kart bt-ev" style="${rv(BT_RENK)}">${bas}<p class="bt-evbos">Bu ay ev için harcama yok. Harcama eklerken <b>Ev (ortak)</b> seçersen burada toplanır.</p>${lim?`<small class="bt-evlim">Aylık ev limiti ${btTL0(lim)}</small>`:''}</section>`;
 const kat={},kim={};L.forEach(t=>{kat[t.cat||'Diğer']=(kat[t.cat||'Diğer']||0)+(+t.amt||0);const k=t.kim||btBen();kim[k]=(kim[k]||0)+(+t.amt||0)});
 const K=Object.entries(kat).sort((a,b)=>b[1]-a[1]),mx=K[0][1];const P=Object.entries(kim).sort((a,b)=>b[1]-a[1]);

 try{const r=await fetch(`https://api.frankfurter.app/${d}?from=USD&to=TRY,EUR,GBP`);const j=await r.json();if(j.rates&&j.rates.TRY){const u=j.rates.TRY;return {usd:u,eur:u/j.rates.EUR,gbp:u/j.rates.GBP,tarih:j.date,src:'ECB'}}}catch(e){}return null}

 try{let o=null;try{const r=await fetch('https://www.tcmb.gov.tr/kurlar/today.xml');if(r.ok){const t=await r.text();o={};['USD','EUR','GBP'].forEach(c=>{const mm=t.match(new RegExp('CurrencyCode="'+c+'"[\\s\\S]*?<ForexSelling>([\\d.]+)<'));if(mm)o[c.toLowerCase()]=+mm[1]});o.src='TCMB'}}catch(e){}

  let g=null;try{const r=await fetch('https://finans.truncgil.com/v4/today.json');if(r.ok){const j=await r.json(),pick=re=>{const k=Object.keys(j).find(k=>re.test(k));if(!k)return null;const v=j[k];const s=v&&(v.Selling||v['Satış']||v.satis||v.Buying);return s?parseFloat(String(s).replace(/\./g,'').replace(',','.'))||+s:null};g={gram:pick(/^(GRA|gram-altin)$/i),ceyrek:pick(/^(CEYREKALTIN|ceyrek-altin)$/i)}}}catch(e){}
  if(o&&o.usd){S.kur=Object.assign({},K,{usd:o.usd,eur:o.eur||K.eur,gbp:o.gbp||K.gbp,src:o.src+(g&&g.gram?' · altın: piyasa':''),ts:Date.now()},g&&g.gram?{gram:g.gram,ceyrek:g.ceyrek||null}:{});ok=true}

 finally{btKurMesgul=false;if(ok){save();if(rotaAl().ad==='butce')render();if(zorla)toast('Fiyatlar güncellendi')}else{S.kur=Object.assign({},S.kur||{},{ts:Date.now()-5*36e5});if(zorla)toast('Güncel fiyat alınamadı; fiyatı elle girebilirsin')}}}
const btNfx=(v,d)=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:d,minimumFractionDigits:0}).format(+v||0);

 if(x.tur==='doviz')return `${btNfx(x.miktar,0)} ${((VERI.DOV||[]).find(d=>d[0]===x.dov)||[0,x.dov])[1]}`;if(x.tur==='tl')return btTL0(x.miktar);return x.aciklama||'Hediye'}
function btDefDeger(x,K){K=K||btKurNow();const A=btALTM();let bugun=0;if(x.tur==='tl')bugun=x.miktar;else if(x.tur==='doviz')bugun=x.miktar*(K[String(x.dov).toLowerCase()]||0);else if(x.tur==='altin')bugun=x.miktar*btBirim(x.alt,K);else bugun=x.tlO||0;

/* ===== Çocuğum — bebek ve öğrenci takibi tek bölümde =====
   Eski "Bebek Takibi" (bebek) ve "Öğrenci Takibi" (ders) bölümlerinin birleşimi. Veri şekli eski sürümle aynı:
   S.bebek = {ad, dogum, log:[{id, t:'emzirme'|'mama'|'uyku'|'bez', ts, end?, yan?, ml?, tip?}], olcum:[{id, tarih, kg, boy}],
              asi:{sıra:true}, aktif:{emzirme:{id,ts}|null, uyku:{id,ts}|null}, bas:{kod:tarih}, ani:[{id,tur,baslik,tarih,not,foto}],
              gida:[{id,ad,tarih,tepki}]}
     yeni alanlar: S.bebek.ekler = [ikinci/üçüncü bebek — aynı şekil + id], <bebek>.asiT = {sıra: yapıldığı gün}
   S.okul  = {kids:[{id,ad,sinif}], cur, odev:[{id,kid,ders,acik,tarih,done}], sinav:[{id,kid,ders,tur,tarih,puan}],
              yanlis:[{id,kid,ders,konu,not,img,tarih,ok}], pomo:{tarih+kid: tur}, program:{kid:{gün:[{id,ders,saat}]}},
              notlar:[{id,kid,ders,tur,puan,donem}], deneme:[{id,kid,tur,ad,tarih,rows,net}], kitap:[{id,kid,ad,sayfa,okunan}],
              okuma:{tarih+kid: sayfa}, devam:[{id,kid,tarih,tur,gun,not}], calis:[{id,kid,date,ders,dk}]}
     yeni alan: S.okul.odak = {mode, left, end, run, kid} — odak sayacı uygulama kapansa da sürer
   S.kirt = {kid_seviye: [alınan sıra no]}  (kırtasiye listesi, eskisiyle aynı) */
const CC_RENK='#C2417A';
const CC_TUR={emzirme:['Emzirme','baby','#C2417A'],mama:['Biberon','bottle','#2F6FD6'],uyku:['Uyku','moon','#5B4BC4'],bez:['Bez','drop','#0F8F86']};
const CC_BEBEK_SEKME=[['bugun','Bugün'],['buyume','Büyüme'],['asi','Aşılar'],['gelisim','Gelişim']];
const CC_OGR_SEKME=[['bugun','Bugün'],['odev','Ödevler'],['yanlis','Yanlışlar'],['notlar','Notlar']];
const CC_ANIT_IKON={dis:'tooth',kelime1:'chat',adim1:'steps',sac:'star',bayram:'gift',dogumgunu:'cake',diger:'camera'};
const CC_BESIN_MEYVE=['Elma dilimleri','Mandalina','Muz','Üzüm (ikiye kesilmiş)','Armut','Havuç çubukları','Ceviz içi','Kuru kayısı'];
let CC_P=null;/* açık serbest pencere: {p, ciz} — içi yeniden çizilebilsin */

/* ---------- veri ---------- */
function ccBebekHazir(B){B.log=Array.isArray(B.log)?B.log:[];B.olcum=Array.isArray(B.olcum)?B.olcum:[];B.asi=B.asi||{};B.asiT=B.asiT||{};B.aktif=B.aktif||{};if(B.aktif.emzirme===undefined)B.aktif.emzirme=null;if(B.aktif.uyku===undefined)B.aktif.uyku=null;B.bas=B.bas||{};B.ani=Array.isArray(B.ani)?B.ani:[];B.gida=Array.isArray(B.gida)?B.gida:[];return B}
function ccBebekKok(){const B=bolum('bebek',{ad:'',dogum:''});ccBebekHazir(B);B.ekler=Array.isArray(B.ekler)?B.ekler:[];B.ekler.forEach(ccBebekHazir);return B}
function ccOkul(){const O=bolum('okul',{});['kids','odev','sinav','yanlis','notlar','deneme','kitap','devam','calis'].forEach(k=>{if(!Array.isArray(O[k]))O[k]=[]});O.pomo=O.pomo||{};O.program=O.program||{};O.okuma=O.okuma||{};return O}
/* bütün çocuklar: bebekler önce, sonra öğrenciler */
function ccCocuklar(){const B=ccBebekKok(),O=ccOkul(),L=[];
 if(B.ad)L.push({key:'b:ana',tur:'bebek',ad:B.ad,o:B});
 B.ekler.forEach(e=>{if(e.ad)L.push({key:'b:'+e.id,tur:'bebek',ad:e.ad,o:e})});
 O.kids.forEach(k=>L.push({key:'o:'+k.id,tur:'ogr',ad:k.ad||'Öğrenci',o:k}));return L}
function ccSecili(){const L=ccCocuklar();if(!L.length)return null;const s=S.tabs&&S.tabs.ccSec;return L.find(c=>c.key===s)||L[0]}
function ccSecYap(key){tabAyarla('ccSec',key);if(key.startsWith('o:'))S.okul.cur=key.slice(2)}
const ccB=()=>{const c=ccSecili();return c&&c.tur==='bebek'?c.o:null};
const ccK=()=>{const c=ccSecili();return c&&c.tur==='ogr'?c.o:null};
const ccD=k=>(VERI[k]||(k==='DENEME'||k==='KIRT'?{}:[]));

/* ---------- yardımcılar ---------- */
const ccHarf=ad=>(String(ad||'?').trim()[0]||'?').toLocaleUpperCase('tr');
const ccN=x=>nf.format(Math.round((+x||0)*100)/100);
const ccSaat=ts=>saatDk(new Date(ts));
const ccGunBasi=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const ccSure=dk=>{dk=Math.max(0,Math.round(dk));const s=Math.floor(dk/60),d=dk%60;return s?s+' sa'+(d?' '+d+' dk':''):d+' dk'};
const ccSaniye=sn=>{sn=Math.max(0,Math.floor(sn));const s=Math.floor(sn/3600),d=Math.floor(sn%3600/60),x=sn%60;return (s?s+':'+pad(d):pad(d))+':'+pad(x)};
const ccOnce=ts=>{const d=(Date.now()-ts)/6e4;if(d<1)return 'şimdi';if(d<60)return Math.floor(d)+' dk önce';if(d<1440){const s=Math.floor(d/60),m=Math.floor(d%60);return s+' sa'+(s<3&&m>=5?' '+m+' dk':'')+' önce'}return Math.floor(d/1440)+' gün önce'};
const ccFark=ts=>{const d=Math.max(0,(Date.now()-ts)/6e4);if(d<1)return 'Az önce';if(d<60)return Math.floor(d)+' dk';if(d<1440){const s=Math.floor(d/60),m=Math.floor(d%60);return s+' sa'+(s<10&&m?' '+m+' dk':'')}return Math.floor(d/1440)+' gün'};
const ccOnceOn=ts=>Date.now()-ts<6e4?'':'önce · ';
const ccGunYazi=s=>{const n=daysTo(s);return n<-1?-n+' gün gecikti':n===-1?'Dün':n===0?'Bugün':n===1?'Yarın':n<7?n+' gün sonra':tarih(s)};
const ccAyEkle=(s,m)=>{const d=new Date(s+'T12:00:00'),g=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()!==g)d.setDate(0);return ymd(d)};
function ccAy(dogum,s){if(!dogum)return 0;const d=new Date(dogum+'T12:00:00'),n=s?new Date(s+'T12:00:00'):new Date();return (n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0)}
function ccYas(dogum){if(!dogum)return 'Doğum tarihi girilmedi';const b=new Date(dogum+'T12:00:00'),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth(),g=n.getDate()-b.getDate();if(g<0){m--;g+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}
 if(m<0)return 'Doğum tarihi ileride';if(m===0)return g===0?'Bugün doğdu':g+' günlük';return m<24?m+' aylık'+(g?' · '+g+' gün':''):Math.floor(m/12)+' yaşında'+(m%12?' · '+m%12+' ay':'')}
const ccYasKisa=d=>{if(!d)return 'Bebek';const m=ccAy(d);return m<1?Math.max(0,-daysTo(d))+' gün':m<24?m+' ay':Math.floor(m/12)+' yaş'};
const ccHash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function ccFotoSec(cb,max){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=max||900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.onerror=()=>toast('Fotoğraf açılamadı');im.src=r.result};r.readAsDataURL(f)};i.click()}
function ccPerde(ciz,o){const p=perde(ciz(),o);CC_P={p,ciz};return p}
function ccPerdeYenile(){if(!CC_P||!document.body.contains(CC_P.p.el))return;const pen=CC_P.p.el.querySelector('.pen');if(pen)pen.innerHTML='<div class="tut2"></div>'+CC_P.ciz()}
function ccPerdeKapat(){if(CC_P){CC_P.p.kapat();CC_P=null}}
const ccPb=b=>`<div class="pb"><h2>${esc(b)}</h2><button type="button" class="ib2" data-kapat aria-label="Kapat">${ik('close')}</button></div>`;
/* basit sütun grafiği: [[etiket, değer, üstYazı, vurgulu]] */
function ccCubuk(L){const mx=Math.max(1,...L.map(x=>x[1]||0));return `<div class="cc-cub" style="--n:${L.length}">${L.map(([e,v,u,on])=>`<div class="${on?'on':''}"><small>${u!=null&&u!==''?esc(u):''}</small><em><i style="height:${Math.max(3,(v||0)/mx*100)}%"></i></em><span>${esc(e)}</span></div>`).join('')}</div>`}
/* çizgi grafik: P=[{x:'2026-01-02', y}] */
function ccGrafik(P,birim){const W=320,H=164,pl=36,pr=14,pt=18,pb=26;const ys=P.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<.001){mn-=1;mx+=1}const ek=(mx-mn)*.18;mn-=ek;mx+=ek;
 const t0=+new Date(P[0].x+'T12:00:00'),t1=+new Date(P[P.length-1].x+'T12:00:00');const X=p=>pl+(t1===t0?.5:(+new Date(p.x+'T12:00:00')-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
 const yol=P.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 const alan=yol+` L${X(P[P.length-1]).toFixed(1)} ${H-pb} L${X(P[0]).toFixed(1)} ${H-pb} Z`;
 const cz=[0,1,2].map(i=>{const v=mn+(mx-mn)*(.15+i*.35),y=Y(v).toFixed(1);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="ck"/><text x="${pl-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${ccN(Math.round(v*10)/10)}</text>`}).join('');
 const son=P[P.length-1];
 return `<svg class="cc-graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(birim)} gelişimi grafiği"><defs><linearGradient id="ccGr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".24"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>${cz}
  <path d="${alan}" fill="url(#ccGr)" stroke="none"/><path d="${yol}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  ${P.map((p,i)=>`<circle cx="${X(p).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===P.length-1?5:3.2}" class="${i===P.length-1?'son':'nk'}"/>`).join('')}
  <text x="${pl}" y="${H-6}" class="tx">${esc(tarih(P[0].x))}</text><text x="${W-pr}" y="${H-6}" class="tx" text-anchor="end">${esc(tarih(son.x))}</text></svg>`}

/* ================================================================

   ================================================================ */
function ccGorunum(p){p=(p||[]).slice();
 if(p[0]&&/^[bo]:/.test(p[0])){const k=p.shift();if(ccCocuklar().some(c=>c.key===k))ccSecYap(k)}
 if(p[0]==='program'){const k=ccK();return k?ccProgramGorunum(k):ccBosGorunum()}
 if(p[0])ccRotaSekme(p[0]);
 const c=ccSecili();if(!c)return ccBosGorunum();
 return c.tur==='bebek'?ccBebekGorunum(c):ccOgrGorunum(c)}
/* #/cocuk/asi gibi bağlantılar: sekmeyi seç, gerekirse o türden çocuğa geç, sonra adresi sadeleştir */
function ccRotaSekme(v){const c=ccSecili(),L=ccCocuklar();const bT=CC_BEBEK_SEKME.some(x=>x[0]===v),oT=CC_OGR_SEKME.some(x=>x[0]===v);if(!bT&&!oT)return;
 let tur=v==='bugun'?(c&&c.tur):bT?'bebek':'ogr';if(c&&c.tur!==tur){const x=L.find(y=>y.tur===tur);if(x)ccSecYap(x.key);else tur=c.tur}
 if(tur==='bebek'&&bT)tabAyarla('ccBebek',v);if(tur==='ogr'&&oT)tabAyarla('ccOgr',v);
 setTimeout(()=>{if(/^#\/cocuk\/./.test(location.hash))try{history.replaceState(null,'','#/cocuk')}catch(e){}},0)}

function ccFoto(tur){return fotoBolum('cocugum')||(tur==='bebek'?fotoBolum('m_bebek')||fotoAd('bebek'):tur==='ogr'?fotoBolum('m_ders')||fotoAd('ders'):fotoAd('aile2')||fotoAd('bebek'))}
function ccUst(c,ek){const L=ccCocuklar(),bebek=c.tur==='bebek';
 const alt=bebek?esc(ccYas(c.o.dogum))+(c.o.dogum?' · '+esc(tarih(c.o.dogum,{yil:1}))+' doğumlu':''):esc(c.o.sinif||'Öğrenci');
 const ey=ui.btn('Düzenle',{a:'ccDuz',ikon:'edit',sinif:'cam'})+(ek||'')+(L.length<2?ui.btn('Çocuk ekle',{a:'ccEkle',ikon:'plus',sinif:'cam'}):'');
 const sec=L.length>1?`<div class="kaydir cc-secr" role="tablist" aria-label="Çocuk seç">${L.map(x=>`<button class="cc-k${x.key===c.key?' on':''}" role="tab" aria-selected="${x.key===c.key}" data-a="ccSec" data-k="${esc(x.key)}"><span class="av">${x.tur==='bebek'?ik('baby'):esc(ccHarf(x.ad))}</span><b>${esc(x.ad)}</b></button>`).join('')}<button class="cc-k ekle" data-a="ccEkle" aria-label="Çocuk ekle"><span class="av">${ik('plus')}</span><b>Ekle</b></button></div>`:'';
 return ui.kahraman({yol:`${ik(bebek?'baby':'book')}<span>${bebek?'Bebek':'Öğrenci'}</span>`,baslik:c.ad,alt,foto:ccFoto(c.tur),ikon:bebek?'baby':'book',eylemler:ey})+sec}

function ccSecenekler(){return `<div class="cc-iki">
 <button class="cc-sc" data-a="ccEkleBebek" style="${kv('#C2417A')}"><span class="ic">${ik('baby')}</span><b>Bebek</b><small>Beslenme, uyku, bez, aşı takvimi ve büyüme</small><span class="ok">${ik('arrowR')}</span></button>

 return ui.kahraman({baslik:'Çocuğum',alt:'Bebeğinin günlüğü ve öğrencinin okul hayatı, tek yerde.',foto:fotoBolum('cocugum')||fotoAd('aile2')||fotoAd('bebek'),ikon:'baby'})+
 `<section class="kart cc-bos"><div class="bos"><div class="ic">${ik('users')}</div><h3>Bebeğini ya da öğrencini ekle</h3><p>Kimi takip etmek istediğini seç; ekran ona göre hazırlansın. Birden çok çocuk ekleyebilirsin.</p></div>${ccSecenekler()}</section>`+
 ui.not('Kayıtların yalnız bu cihazda tutulur; Ailem bölümünden paylaşmayı seçersen eşin de görebilir.',{ikon:'shield'})}

/* ================================================================
   BEBEK
   ================================================================ */
function ccBebekGorunum(c){const B=c.o,t=tab('ccBebek','bugun');
 let g;if(t!=='bugun'&&!B.dogum)g=ui.kart({ic:ui.bos({ikon:'calendar',baslik:'Doğum tarihini ekle',yazi:'Aşı takvimi, gelişim basamakları ve büyüme çizelgesi doğum tarihine göre hesaplanır.',btn:{yazi:'Doğum tarihini ekle',a:'ccDuz',ikon:'edit'}})});
 else g=t==='buyume'?ccBuyume(B):t==='asi'?ccAsilar(B):t==='gelisim'?ccGelisim(B):ccBebekBugun(B);
 return ccUst(c)+ui.sekme('ccBebek',CC_BEBEK_SEKME,t)+g}

function ccBebekBugun(B){const L=B.log,t0=ccGunBasi(),A=B.aktif,simdi=Date.now();
 const bugun=L.filter(x=>x.ts>=t0).sort((a,b)=>b.ts-a.ts);const say=k=>bugun.filter(x=>x.t===k).length;
 const son=T=>L.filter(x=>T.includes(x.t)).sort((a,b)=>b.ts-a.ts)[0];
 const sb=son(['emzirme','mama']),su=L.filter(x=>x.t==='uyku'&&x.end).sort((a,b)=>b.end-a.end)[0],sz=son(['bez']);
 const ml=bugun.filter(x=>x.t==='mama').reduce((s,x)=>s+(+x.ml||0),0);
 const uykuDk=bugun.filter(x=>x.t==='uyku').reduce((s,x)=>s+((x.end||(A.uyku&&A.uyku.id===x.id?simdi:x.ts))-x.ts)/6e4,0);
 /* son ne zaman */
 const hucre=(tur,baslik,deger,alt,canli)=>`<div style="${kv(CC_TUR[tur][2])}"><small>${ik(CC_TUR[tur][1])}${esc(baslik)}</small><b${canli?` class="canli" data-cc-gecen="${canli}"`:''}>${esc(deger)}</b><span>${esc(alt)}</span></div>`;
 const bes=A.emzirme?hucre('emzirme','Beslenme','Emziriyor',ccSaat(A.emzirme.ts)+' başladı'):sb?hucre(sb.t,'Beslenme',ccFark(sb.ts),ccOnceOn(sb.ts)+(sb.t==='mama'?(sb.ml?sb.ml+' ml':'biberon'):(sb.yan?sb.yan.toLocaleLowerCase('tr'):'emzirme'))):hucre('emzirme','Beslenme','—','Kayıt yok');
 const uy=A.uyku?hucre('uyku','Uyku','Uyuyor',ccSaat(A.uyku.ts)+' yattı'):su?hucre('uyku','Uyku',ccFark(su.end),(Date.now()-su.end<6e4?'uyandı':'önce uyandı')):hucre('uyku','Uyku','—','Kayıt yok');
 const bz=sz?hucre('bez','Bez',ccFark(sz.ts),ccOnceOn(sz.ts)+(sz.tip||'bez').toLocaleLowerCase('tr')):hucre('bez','Bez','—','Kayıt yok');
 const durum=`<section class="kart cc-dur" aria-label="Son kayıtlar">${bes}${uy}${bz}</section>`;
 /* büyük düğmeler */
 const sonYan=(L.filter(x=>x.t==='emzirme'&&x.yan).sort((a,b)=>b.ts-a.ts)[0]||{}).yan;
 const dv=(tur,a,baslik,alt,on,aria)=>{const r=CC_TUR[tur][2];return `<button class="cc-dv${on?' on':''}" data-a="${a}" style="${kv(r)};--kk:${koyu(r,.7)}" aria-label="${esc(aria||baslik)}"><span class="ic">${ik(CC_TUR[tur][1])}</span><b>${esc(baslik)}</b>${alt}${on?'<i class="nabiz" aria-hidden="true"></i>':''}</button>`};
 const dugme=`<div class="cc-dev">
  ${A.emzirme?dv('emzirme','ccEmz','Emzirmeyi bitir',`<span class="canli" data-cc-gecen="${A.emzirme.ts}">${ccSaniye((simdi-A.emzirme.ts)/1e3)}</span><small>${esc((L.find(x=>x.id===A.emzirme.id)||{}).yan||'')} taraf</small>`,1):dv('emzirme','ccEmz','Emzirme',`<small>${sonYan?say('emzirme')+' kez · sıra '+(sonYan==='Sol'?'sağda':'solda'):'Bugün '+say('emzirme')+' kez'}</small>`,0,'Emzirmeyi başlat')}
  ${dv('mama','ccMama','Biberon',`<small>Bugün ${say('mama')} kez${ml?' · '+ml+' ml':''}</small>`)}
  ${A.uyku?dv('uyku','ccUyku','Uyandı',`<span class="canli" data-cc-gecen="${A.uyku.ts}">${ccSaniye((simdi-A.uyku.ts)/1e3)}</span><small>Uyuyor</small>`,1,'Uykuyu bitir'):dv('uyku','ccUyku','Uyku başlat',`<small>Bugün ${uykuDk>=1?ccSure(uykuDk):'uyku yok'}</small>`)}
  ${dv('bez','ccBez','Bez',`<small>Bugün ${say('bez')} bez</small>`,0,'Bez değişimi kaydet')}</div>`;
 /* yaklaşan aşı */
 let asi='';if(B.dogum){const s=(ccD('ASI')).map(([m,n],i)=>({i,n,due:ccAyEkle(B.dogum,m)})).find(x=>!B.asi[x.i]);if(s){const d=daysTo(s.due);if(d<=14)asi=ui.not(`<b>${esc(s.n)}</b> · ${d<0?'zamanı geldi':d===0?'bugün':d+' gün kaldı'}. <button class="cc-lnk" data-a="sekme" data-k="ccBebek" data-v="asi">Aşı takvimine bak</button>`,{ikon:'shield'})}}
 /* bugünün kayıtları */
 const sat=x=>{const T=CC_TUR[x.t]||CC_TUR.bez;const det=x.t==='emzirme'?x.yan:x.t==='mama'?(x.ml?x.ml+' ml':''):x.t==='bez'?x.tip:'';
  const sure=x.end?' – '+ccSaat(x.end)+' · '+ccSure((x.end-x.ts)/6e4):(x.t==='emzirme'||x.t==='uyku')&&A[x.t]&&A[x.t].id===x.id?' · sürüyor':'';
  return ui.sat({ikon:T[1],renk:T[2],baslik:T[0]+(det?' · '+det:''),alt:ccSaat(x.ts)+sure,a:'ccLogDuz',data:{id:x.id},ok:1})};
 const liste=ui.kart({baslik:'Bugünün kaydı',lnk:bugun.length?{yazi:'Paylaş',a:'ccPaylas'}:null,ic:(bugun.length?ui.satirlar(bugun.map(sat)):`<p class="cc-az">Henüz kayıt yok. Yukarıdaki düğmelere tek dokunuşla kaydet.</p>`)+`<button class="cc-ac" data-a="ccElle">${ik('plus')}Unuttuğun bir kaydı ekle</button>`});
 return durum+dugme+asi+liste}

const ccSaatTs=(ts,hm)=>{const d=new Date(ts);const [h,m]=String(hm||'').split(':').map(Number);if(isNaN(h))return ts;d.setHours(h,m||0,0,0);return d.getTime()};
function ccLogAlan(t,x){x=x||{};const A=[{k:'saat',yazi:t==='uyku'||t==='emzirme'?'Başlangıç':'Saat',tur:'saat',deger:ccSaat(x.ts||Date.now()),zorunlu:1}];
 if(t==='uyku'||t==='emzirme')A.push({k:'bitis',yazi:'Bitiş (boş bırakırsan sürüyor sayılır)',tur:'saat',deger:x.end?ccSaat(x.end):''});
 if(t==='emzirme')A.push({k:'yan',yazi:'Taraf',tur:'sec',deger:x.yan||'Sol',secenek:[['Sol','Sol'],['Sağ','Sağ']]});
 if(t==='mama')A.push({k:'ml',yazi:'Miktar (ml)',tur:'sayi',deger:x.ml||'',ph:'Örn. 120'});
 if(t==='bez')A.push({k:'tip',yazi:'Tür',tur:'sec',deger:x.tip||'Islak',secenek:[['Islak','Islak'],['Kirli','Kirli'],['İkisi','İkisi']]});return A}
function ccLogYaz(B,x,v,yeni){const t=x.t;x.ts=ccSaatTs(x.ts,v.saat);if(x.ts>Date.now()+6e4)x.ts-=864e5;
 if(t==='uyku'||t==='emzirme'){const ak=B.aktif[t]&&B.aktif[t].id===x.id;if(v.bitis){let e=ccSaatTs(x.ts,v.bitis);if(e<=x.ts)e+=864e5;x.end=e;if(ak)B.aktif[t]=null}else if(!yeni&&!ak&&x.end){/* bitiş silinmez */}else if(yeni&&!B.aktif[t]){B.aktif[t]={id:x.id,ts:x.ts}}else if(ak)B.aktif[t].ts=x.ts}
 if(t==='emzirme')x.yan=v.yan;if(t==='mama'){const m=Math.round(sayi(v.ml));if(m>0)x.ml=m}if(t==='bez')x.tip=v.tip;x._u=Date.now()}
eylem('ccLogDuz',d=>{const B=ccB();if(!B)return;const x=B.log.find(y=>y.id===d.id);if(!x)return;const T=CC_TUR[x.t]||CC_TUR.bez;
 pencere({baslik:T[0]+' kaydı',renk:T[2],alanlar:ccLogAlan(x.t,x),odaksiz:1,kaydet:v=>{ccLogYaz(B,x,v,false);save();render();toast('Kayıt güncellendi')},sil:()=>{B.log=B.log.filter(y=>y.id!==x.id);['emzirme','uyku'].forEach(k=>{if(B.aktif[k]&&B.aktif[k].id===x.id)B.aktif[k]=null});save();render();toast('Kayıt silindi')}})});

eylem('ccElleTur',d=>{const B=ccB();if(!B)return;const T=CC_TUR[d.v];setTimeout(()=>pencere({baslik:T[0]+' ekle',renk:T[2],tamam:'Kaydı ekle',odaksiz:1,alanlar:ccLogAlan(d.v,{ts:Date.now()-30*6e4}),kaydet:v=>{const x={id:uid(),t:d.v,ts:Date.now()};ccLogYaz(B,x,v,true);B.log.push(x);save();render();toast('Kayıt eklendi')}}),240)});

/* ana sayfa ve özetler: [{baslik, alt, ikon, href}] — örn. "Elif · son beslenme 2 sa önce", "Ali · yarın Matematik sınavı" */
function ccBugunOzet(){const out=[];let L;try{L=ccCocuklar()}catch(e){return out}const t=today();
 L.forEach(c=>{const href='#/cocuk/'+c.key;
  if(c.tur==='bebek'){const B=c.o,A=B.aktif;
   if(A.uyku)out.push({baslik:c.ad+' · uyuyor',alt:ccSure((Date.now()-A.uyku.ts)/6e4)+' oldu',ikon:'moon',href});
   else if(A.emzirme)out.push({baslik:c.ad+' · emziriliyor',alt:ccSure((Date.now()-A.emzirme.ts)/6e4)+' oldu',ikon:'baby',href});
   else{const sb=B.log.filter(x=>x.t==='emzirme'||x.t==='mama').sort((a,b)=>b.ts-a.ts)[0];const t0=ccGunBasi(),bz=B.log.filter(x=>x.t==='bez'&&x.ts>=t0).length;
    out.push({baslik:c.ad+(sb?' · son beslenme '+ccOnce(sb.ts):' · bugün kayıt yok'),alt:ccYas(B.dogum)+(bz?' · bugün '+bz+' bez':''),ikon:sb&&sb.t==='mama'?'bottle':'baby',href})}
   if(B.dogum){const s=ccD('ASI').map(([m,n],i)=>({i,n,due:ccAyEkle(B.dogum,m)})).find(x=>!B.asi[x.i]);if(s){const d=daysTo(s.due);if(d<=7)out.push({baslik:c.ad+' · '+(d<0?'aşı zamanı geldi':d===0?'bugün aşı günü':d+' gün sonra aşı'),alt:s.n,ikon:'shield',href:'#/cocuk/'+c.key+'/asi'})}}}
  else{const O=ccOkul(),k=c.o;const sn=O.sinav.filter(x=>x.kid===k.id&&x.puan==null&&x.tarih>=t&&daysTo(x.tarih)<=3).sort((a,b)=>a.tarih.localeCompare(b.tarih))[0];
   const od=O.odev.filter(x=>x.kid===k.id&&!x.done&&daysTo(x.tarih)<=1);
   if(sn){const d=daysTo(sn.tarih);out.push({baslik:`${c.ad} · ${d===0?'bugün':d===1?'yarın':d+' gün sonra'} ${sn.ders} sınavı`,alt:sn.tur||'Sınav',ikon:'star',href:'#/cocuk/'+c.key+'/odev'})}
   if(od.length){const gec=od.filter(x=>daysTo(x.tarih)<0).length,bg=od.filter(x=>daysTo(x.tarih)===0).length;
    out.push({baslik:`${c.ad} · ${gec?gec+' ödev gecikti':bg?bg+' ödev bugün teslim':od.length+' ödev yarın teslim'}`,alt:od.map(x=>x.ders).slice(0,3).join(', '),ikon:'notebook',href:'#/cocuk/'+c.key+'/odev'})}}});
 return out}

 L.forEach(c=>{if(c.tur==='bebek'){const B=c.o;if(B.dogum)ccD('ASI').forEach(([m,n],i)=>{if(!B.asi[i]&&ccAyEkle(B.dogum,m)===d)out.push({baslik:c.ad+' · '+n,ikon:'shield',renk:CC_RENK,href:'#/cocuk/'+c.key+'/asi'})})}
  else{O.odev.filter(x=>x.kid===c.o.id&&!x.done&&x.tarih===d).forEach(x=>out.push({baslik:c.ad+' · '+x.ders+' ödevi teslim',ikon:'notebook',renk:CC_RENK,href:'#/cocuk/'+c.key+'/odev'}));
   O.sinav.filter(x=>x.kid===c.o.id&&x.puan==null&&x.tarih===d).forEach(x=>out.push({baslik:c.ad+' · '+x.ders+' sınavı',ikon:'star',renk:CC_RENK,href:'#/cocuk/'+c.key+'/odev'}))}});
 if(O.kids.length)ccD('OKULT').forEach(([a,b,n])=>{if(d>=a&&d<=b)out.push({baslik:n+(a!==b?(d===a?' başlıyor':d===b?' · son gün':''):''),ikon:'calendar',renk:'#3456A8',href:'#/cocuk'})});
 return out}

const GY_ORT_HARF={gunluk:'g',is:'i',okul:'k',ozel:'o',spor:'s',ev:'e'};

/* ---------- yardımcılar ---------- */
function gyG(){const G=bolum('giysem',{kisi:'kadin',gard:[],fav:[]});G.gard=Array.isArray(G.gard)?G.gard:[];G.fav=Array.isArray(G.fav)?G.fav:[];if(!GY_KISI.some(x=>x[0]===G.kisi))G.kisi='kadin';
 G.gard.forEach(x=>{if(!x.id)x.id=uid()});G.fav.forEach(x=>{if(!x.id)x.id=uid();x.ids=Array.isArray(x.ids)?x.ids:[]});return G}
const gyBant=t=>t<=5?0:t<=12?1:t<=18?2:t<=24?3:4;
const gyMevsimOf=t=>t<=12?'Kış':t<=22?'Bahar / sonbahar':'Yaz';
const gyMevsim=()=>{const m=new Date().getMonth();return m<=1||m===11?'kis':m<=4?'bahar':m<=7?'yaz':'sonbahar'};
/* kişiye göre geçerli ortam (çocukta "iş" yok, okul olur) */
function gyOrtamAl(G){G=G||gyG();let o=G.ortam||'gunluk';if(!GY_ORTAM.some(x=>x[0]===o))o='gunluk';if(G.kisi==='cocuk'&&o==='is')o='okul';return o}
const gyOrtamlar=k=>GY_ORTAM.filter(x=>!(k==='cocuk'&&x[0]==='is'));
const gyOrtamAd=o=>(GY_ORTAM.find(x=>x[0]===o)||GY_ORTAM[0])[1];
/* tohumlu rastgele: aynı gün, aynı seçimle hep aynı sonuç */
function gyRnd(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const gySec=(L,r)=>L.length?L[Math.floor(r()*L.length)]:null;
/* açık renk mi (simge rengini seçmek için) */
function gyAcik(hex){if(!hex)return true;const [r,g,b]=hexRgb(hex);return (r*299+g*587+b*114)/1000>165}
const gyKisiAd=k=>(GY_KISI.find(x=>x[0]===k)||GY_KISI[0])[1];
/* hava özeti */
function gyHava(){const h=hava(),[y,i]=havaYazi(h.code);const b=gyBant(h.t);return Object.assign({},h,{yazi:y,ikon:i,bant:b,bantYazi:GY_BANT[b]})}

/* ---------- genel kombin (dolap dışı) ---------- */
function gyGenel(kisi,o,hv,tst,n){const b=hv.bant,K={kadin:'K',erkek:'E',cocuk:'C'}[kisi],oh=GY_ORT_HARF[o]||'g';tst=tst&&kisi==='kadin';
 const r=gyRnd([today(),kisi,o,tst?1:0,n||0,b].join('|'));
 const P=GY_PARCA.filter(x=>x.k.includes(K)&&x.b.includes(String(b))&&x.o.includes(oh)&&(tst?!x.f.includes('x'):!x.f.includes('T')));
 const by=s=>P.filter(x=>x.s===s);const L=[];
 const tek=by('t'),ust=by('u'),alt=by('a');
 const tekSec=tek.length&&(!(ust.length&&alt.length)||o==='ev'||r()<.35);
 let tk=null;if(tekSec){tk=gySec(tek,r)}
 const dis=by('d');const disGerek=o==='ev'?b<=1:(b<=2||(b===3&&r()<.5));
 if(disGerek&&dis.length&&!(tk&&tk.f.includes('u')&&b>=2))L.push(gySec(dis,r));
 if(tk){if(tk.f.includes('u')&&ust.length)L.push(gySec(ust,r));L.push(tk)}else{const u=gySec(ust,r),a=gySec(alt,r);if(u)L.push(u);if(a)L.push(a)}
 const ay=by('y');let y=null;if(hv.rain&&b<=3){const z=ay.filter(x=>x.f.includes('z'));y=gySec(z.length?z:ay,r)}else y=gySec(ay,r);if(y)L.push(y);
 const ak=by('k');const kis=ak.filter(x=>x.f.includes('w')),sal=ak.filter(x=>x.f.includes('T')),dig=ak.filter(x=>!x.f.includes('w')&&!x.f.includes('T'));
 if(b<=1&&kis.length)L.push(gySec(kis,r));if(tst&&sal.length)L.push(gySec(sal,r));if(dig.length&&(o==='ozel'||o==='is'||r()<.75))L.push(gySec(dig,r));
 const parca=L.filter(Boolean).map(x=>({s:x.s,ad:x.ad,ikon:x.ik}));
 if(hv.rain&&o!=='ev')parca.push({s:'s',ad:'Şemsiye',ikon:'umbrella'});
 return parca}

/* ---------- dolaptan kombin ---------- */
function gyDolap(G,kisi,t){return G.gard.filter(x=>x.kisi===kisi&&(!x.mev||x.mev==='Her mevsim'||x.mev===gyMevsimOf(t)))}
const gyYeterli=D=>D.some(x=>x.kat==='Elbise')||(D.some(x=>x.kat==='Üst')&&D.some(x=>x.kat==='Alt'));
function gyGiyilen(G){const s=new Set();Object.entries(G.worn||{}).forEach(([d,ids])=>{const n=-daysTo(d);if(n>=0&&n<=3&&Array.isArray(ids))ids.forEach(i=>s.add(i))});return s}
/* renk uyumu: {iyi, yazi, puan} */
function gyRenkNot(items){const keys=items.map(x=>x.renk).filter(k=>k&&GY_RENK_M[k]);if(!keys.length)return null;
 const ac=[...new Set(keys.filter(k=>!GY_RENK_M[k][3]&&k!=='desen'))],desen=keys.includes('desen');const ad=k=>trAlt(GY_RENK_M[k][1]);
 if(desen&&ac.length)return {iyi:0,puan:-1.5,yazi:'Desenli parçayı tek yıldız yap; yanına düz ve sade renk seç.'};
 if(desen)return {iyi:1,puan:.5,yazi:'Desenli parça öne çıkıyor; nötr tonlar onu güzel dengeliyor.'};
 if(!ac.length)return {iyi:1,puan:.6,yazi:'Nötr tonlar sade ve şık; renkli bir aksesuar kombini canlandırır.'};
 if(ac.length===1)return {iyi:1,puan:1,yazi:bas(ad(ac[0]))+' tek vurgu renk; nötrlerle dengeli bir kombin.'};
 if(ac.length===2&&gyUyumlu(ac[0],ac[1]))return {iyi:1,puan:.9,yazi:bas(ad(ac[0]))+' ve '+ad(ac[1])+' birbirini tamamlar.'};
 if(ac.length===2)return {iyi:0,puan:-1,yazi:bas(ad(ac[0]))+' ve '+ad(ac[1])+' birlikte iddialı; birini nötr bir parçayla değiştirebilirsin.'};
 return {iyi:0,puan:-2,yazi:'Çok renk var; bir ya da iki renkte kalmak daha şık durur.'}}
function gyTarzPuan(x,o){const t=x.tarz;if(!t)return 0;const ist=o==='is'||o==='ozel'?'sik':o==='spor'?'spor':'gunluk';if(t===ist)return 1;if((ist==='sik'&&t==='spor')||(ist==='spor'&&t==='sik'))return -1.5;return 0}
function gyDolapSec(G,kisi,o,hv,n,onc){onc=new Set(onc||[]);const D=gyDolap(G,kisi,hv.t);if(!gyYeterli(D))return null;const b=hv.bant;const giy=gyGiyilen(G);const r=gyRnd([today(),kisi,o,n||0,'dolap'].join('|'));
 const by=k=>{const L=D.filter(x=>x.kat===k);const f=L.filter(x=>!giy.has(x.id));return f.length?f:L};
 let en=null;
 for(let i=0;i<14;i++){const el=by('Elbise'),ust=by('Üst'),alt=by('Alt');const L=[];
  if(el.length&&(!(ust.length&&alt.length)||r()<.4))L.push(gySec(el,r));else{L.push(gySec(ust,r),gySec(alt,r))}
  if((b<=2||(b===3&&o!=='ev'&&r()<.4))&&by('Dış giyim').length)L.push(gySec(by('Dış giyim'),r));
  if(by('Ayakkabı').length)L.push(gySec(by('Ayakkabı'),r));
  if(by('Çanta & aksesuar').length&&(o==='ozel'||o==='is'||r()<.6))L.push(gySec(by('Çanta & aksesuar'),r));
  const rn=gyRenkNot(L);const p=(rn?rn.puan:0)+L.reduce((s,x)=>s+gyTarzPuan(x,o)-(onc.has(x.id)?.9:0),0)+r()*.8;
  if(!en||p>en.p)en={p,ids:L.map(x=>x.id)}}
 return en.ids}

/* ---------- bugünün kombini ---------- */
const GY_SIRA={d:0,u:1,t:2,a:3,y:4,k:5,s:6};
function gyKombin(kaydet){const G=gyG(),k=G.kisi,o=gyOrtamAl(G),hv=gyHava(),tst=!!G.tst&&k==='kadin';
 const c=G.cur,gec=c&&c.date===today()&&c.kisi===k&&(c.ortam||'gunluk')===o;const n=gec?(c.n||0):0;
 let parca=null,kaynak='oneri',ids=[],fav=gec&&c.fav?G.fav.find(f=>f.id===c.fav):null;
 if(gec&&Array.isArray(c.p)&&c.p.length){parca=c.p.map(([s,ad,i])=>({s,ad,ikon:i}))}
 if(gec&&Array.isArray(c.ids)&&c.ids.length)ids=c.ids.filter(id=>G.gard.some(x=>x.id===id));
 if(!parca&&!ids.length){ids=gyDolapSec(G,k,o,hv,n,gec?c.onc:null)||[];if(kaydet&&!(gec&&(c.n||0)===n&&(c.ids||[]).join()===ids.join())){G.cur={date:today(),kisi:k,ortam:o,n,ids:ids.slice()};if(gec&&c.onc)G.cur.onc=c.onc;save()}}
 const genel=gyGenel(k,o,hv,tst,n);
 if(ids.length){kaynak='dolap';const it=ids.map(id=>G.gard.find(x=>x.id===id)).filter(Boolean);
  const bolge={'Dış giyim':'d','Üst':'u','Alt':'a','Elbise':'t','Ayakkabı':'y','Çanta & aksesuar':'k'};
  parca=it.map(x=>({s:bolge[x.kat]||'k',ad:x.ad||x.kat,ikon:GY_KAT_IK[x.kat]||'hanger',img:x.img||'',renk:x.renk||'',id:x.id}));
  /* dolapta olmayan ama gereken parçaları öneriyle tamamla */
  const var_=new Set(parca.map(p=>p.s));
  genel.forEach(g=>{if((g.s==='y'||g.s==='s'||(g.s==='d'&&hv.bant<=1)||(g.s==='k'&&hv.bant<=1&&/atkı|bere|eldiven/i.test(g.ad)))&&!(var_.has(g.s)&&g.s!=='k')){if(g.s==='k'&&parca.some(p=>p.ad===g.ad))return;parca.push(Object.assign({oneri:1},g))}})}
 else if(!parca)parca=genel;
 else{kaynak='fav';if(hv.rain&&o!=='ev'&&!parca.some(p=>p.s==='s'))parca.push({s:'s',ad:'Şemsiye',ikon:'umbrella'})}
 parca.sort((a,b)=>GY_SIRA[a.s]-GY_SIRA[b.s]);
 /* renk notu */
 let renk=null;const rn=kaynak!=='oneri'?gyRenkNot(parca.filter(p=>p.renk).map(p=>({renk:p.renk}))):null;
 if(rn)renk={yazi:rn.yazi,iyi:rn.iyi,sw:[...new Set(parca.filter(p=>p.renk&&GY_RENK_M[p.renk]).map(p=>p.renk))].slice(0,4).map(k=>GY_RENK_M[k][2]||'')};
 else{const Pal=(VERI.RENK||{})[gyMevsim()]||[];if(Pal.length){const rr=gyRnd(today()+'renk'),i=Math.floor(rr()*Pal.length),j=(i+1+Math.floor(rr()*(Pal.length-1)))%Pal.length,m=[0,1,2,3,4].find(x=>x!==i&&x!==j&&x<Pal.length);const R=[Pal[i],Pal[j],Pal[m]].filter(Boolean);
  renk={baslik:'Bugünün renkleri',yazi:R.map((x,q)=>q?trAlt(x[1]):x[1]).join(', ').replace(/, ([^,]*)$/,' ve $1')+'. Birini öne çıkar, gerisini nötrlerle dengele.',iyi:1,sw:R.map(x=>x[0])}}}
 /* uyarı: yağmur > sıcaklık farkı > rüzgâr > soğuk */
 let uy=null;
 if(hv.rain&&o!=='ev')uy={ikon:'umbrella',yazi:'Yağmur bekleniyor: şemsiyeni al, su geçirmez ayakkabı seç.'};
 else if(hv.canli&&hv.max!=null&&hv.min!=null&&hv.max-hv.min>=9&&o!=='ev')uy={ikon:'thermo',yazi:`Gün içinde ${hv.min}° ile ${hv.max}° arası: katmanlı giyin.`};
 else if(hv.wind>30&&o!=='ev')uy={ikon:'cloud',yazi:'Rüzgârlı bir gün: rüzgâr geçirmeyen bir dış katman iyi olur.'};
 else if(hv.bant===0&&o!=='ev')uy={ikon:'snow',yazi:'Çok soğuk: kat kat giyin, başını ve ellerini koru.'};
 const ob=(GY_ORTAM.find(x=>x[0]===o)||GY_ORTAM[0]);
 const baslik=fav?fav.ad:ob[3];
 return {G,kisi:k,ortam:o,hv,parca,kaynak,ids,renk,uy,baslik,n,fav,tst}}

function gyFavImza(ids,p){return (ids||[]).slice().sort().join(',')+'|'+(p||[]).map(x=>x[1]).join(',')}
function gyFavVar(K){const ids=K.kaynak==='dolap'?K.ids:[];const p=K.kaynak==='dolap'?[]:K.parca.filter(x=>x.s!=='s').map(x=>[x.s,x.ad,x.ikon]);const im=gyFavImza(ids,p);return K.G.fav.some(f=>f.kisi===K.kisi&&gyFavImza(f.ids,f.p)===im)}
function gyFavSekme(K){const G=K.G;const F=G.fav.filter(f=>f.kisi===K.kisi).map((f,i)=>[f,i]).sort((a,b)=>((b[0].t||0)-(a[0].t||0))||(b[1]-a[1])).map(x=>x[0]);
 if(!F.length)return ui.kart({ic:ui.bos({ikon:'heart',baslik:'Henüz favori kombin yok',yazi:'Beğendiğin kombini “Favorilere kaydet” ile sakla; özel günlerde hemen bul.',btn:{yazi:'Bugünün kombinine bak',a:'sekme',data:{k:'giysem',v:'gun'},ikon:'sparkles'}})});
 return F.map(f=>{const it=f.ids.map(id=>G.gard.find(x=>x.id===id)).filter(Boolean);const pp=Array.isArray(f.p)?f.p:[];
  const kucuk=[...it.map(x=>{const R=x.renk&&GY_RENK_M[x.renk];return `<span class="gy-ft">${x.img?`<img src="${x.img}" alt="">`:`<i style="background:${R&&R[2]?R[2]:'var(--r1)'};color:${R&&R[2]?(gyAcik(R[2])?'#2A2F3A':'#fff'):'var(--r)'}">${ik(GY_KAT_IK[x.kat]||'hanger')}</i>`}</span>`}),...pp.map(([s,ad,i])=>`<span class="gy-ft" title="${esc(ad)}"><i>${ik(i||'shirt')}</i></span>`)];
  const adlar=[...it.map(x=>x.ad||x.kat),...pp.map(x=>x[1])];
  const alt=[f.ortam?gyOrtamAd(f.ortam):'',f.t?tarih(ymd(new Date(f.t))):''].filter(Boolean).join(' · ');
  return `<section class="kart gy-fav"><div class="gy-fu"><div><b>${esc(f.ad||'Kombin')}</b>${alt?`<small>${esc(alt)}</small>`:''}</div>${ui.ib('trash','gyFavSil',{id:f.id},'Favoriden çıkar')}</div>
   ${kucuk.length?`<div class="gy-fk">${kucuk.join('')}</div><p class="gy-fa">${esc(adlar.join(', '))}</p>`:`<p class="gy-fa">Bu kombinin parçaları dolabından silinmiş.</p>`}
   ${kucuk.length?ui.btn('Bugün bunu giy',{a:'gyFavGiy',data:{id:f.id},ikon:'shirt',sinif:'hafif kucuk'}):''}</section>`}).join('')}

 const liste=(k,baslik,ac,ikon)=>{let L=P.filter(x=>x.k===k);if(ara)L=L.filter(x=>norm(x.t+' '+(x.e||[]).join(' ')).includes(ara));const hep=gyHepsi[k]||ara;const G=hep?L:L.slice(0,5);

 const lk=liste('leke','Leke çıkarma','Lekeyi bekletmeden doğru yöntemle çıkar.','drop'),cm=liste('camasir','Çamaşır ve ütü','Kıyafetlerin uzun ömürlü olsun.','shirt');

const GY_YER=[['sehir','Şehir'],['deniz','Deniz'],['doga','Doğa / yayla'],['is','İş seyahati'],['dugun','Düğün / davet']];
function gyValizListe(gun,b,kisi,yer){const n=Math.max(1,gun),L=[];const a=(g,ad,adet)=>L.push([g,ad,adet]);
 a('Giyim','İç çamaşırı',n+1);a('Giyim','Çorap',b>=4&&yer!=='is'?Math.ceil(n/2)+1:n+1);a('Giyim',b>=3?'Tişört / bluz':'Uzun kollu üst',n);a('Giyim',b>=4?'Şort ya da ince pantolon':'Pantolon',Math.ceil(n/3)+1);a('Giyim','Pijama',n>4?2:1);
 if(b<=2)a('Giyim','Kazak / hırka',Math.ceil(n/3)+1);if(b<=1)a('Giyim','Mont veya kaban',1);if(b<=1)a('Giyim','Atkı, bere, eldiven',1);if(b>=4)a('Giyim','Mayo / deniz havlusu',yer==='deniz'?2:1);
 if(yer==='is')a('Giyim','Gömlek ve şık kıyafet',Math.ceil(n/2)+1);if(yer==='dugun')a('Giyim','Davet kıyafeti',1);
 a('Ayakkabı','Rahat yürüyüş ayakkabısı',1);if(b>=4)a('Ayakkabı','Sandalet / terlik',1);if(yer==='is'||yer==='dugun')a('Ayakkabı','Şık ayakkabı',1);
 ['Diş fırçası ve macun','Şampuan ve duş jeli','Tarak / fırça','Deodorant','Tırnak makası'].forEach(x=>a('Kişisel bakım',x,1));if(b>=3)a('Kişisel bakım','Güneş kremi',1);
 ['Telefon şarj aleti','Powerbank','Kulaklık'].forEach(x=>a('Elektronik',x,1));
 ['Kimlik','Kullandığın ilaçlar','Islak mendil','Su şişesi'].forEach(x=>a('Önemli',x,1));if(yer==='deniz'||yer==='doga')a('Önemli','Şapka ve güneş gözlüğü',1);
 if(kisi==='cocuk'){a('Çocuk','Yedek kıyafet takımı',2);a('Çocuk','Sevdiği oyuncak / kitap',1);a('Çocuk','Atıştırmalık',1)}
 return L}
function gyValizGorunum(){const G=gyG();const V=G.valiz=G.valiz||{gun:3,yer:'sehir',done:{}};V.done=V.done||{};const hv=gyHava();const b=V.hb!=null?+V.hb:hv.bant;
 const L=gyValizListe(V.gun||3,b,G.kisi,V.yer||'sehir');const ok=L.filter(x=>V.done[x[1]]).length;const grp=[...new Set(L.map(x=>x[0]))];
 const ust=ui.kahraman({baslik:'Valiz hazırla',alt:esc(`${V.gun||3} günlük yolculuk · ${ok}/${L.length} hazır`),ikon:'bag',yol:`<a href="#/giysem">${ik('chevL')}Ne giysem?</a>`});
 const ayar=`<section class="kart gy-va"><div class="gy-vg"><b>Kaç gün?</b><div class="gy-st"><button type="button" data-a="gyValGun" data-d="-1" aria-label="Bir gün azalt">${ik('minus')}</button><b>${V.gun||3} gün</b><button type="button" data-a="gyValGun" data-d="1" aria-label="Bir gün artır">${ik('plus')}</button></div></div>
  <p class="gy-vl">Nereye?</p><div class="cipler sar">${GY_YER.map(([v,y])=>`<button type="button" class="cip${(V.yer||'sehir')===v?' on':''}" data-a="gyValYer" data-v="${v}">${esc(y)}</button>`).join('')}</div>

 const ilr=`<div class="gy-vi">${ui.ilerleme(ok/L.length*100)}</div>`;
 const liste=grp.map(g=>ui.kart({baslik:g,lnk:g===grp[0]&&ok?{yazi:'Sıfırla',a:'gyValSifir'}:null,ic:ui.satirlar(L.filter(x=>x[0]===g).map(([,ad,n])=>`<div class="sat gy-vs${V.done[ad]?' bitti':''}">${ui.tik(!!V.done[ad],'gyValTik',{k:ad},V.done[ad]?'Hazır değil yap':'Hazır olarak işaretle')}<button type="button" class="gv" data-a="gyValTik" data-k="${esc(ad)}"><b>${esc(ad)}</b></button>${n>1?`<span class="sg"><span class="etiket">${n} adet</span></span>`:''}</div>`))})).join('');
 return ust+ayar+ilr+liste}

/* fotoğrafı seç, küçült (en çok 520 px, JPEG) ve formdaki gizli alana yaz */
function gyResimKucult(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast('Bu fotoğraf açılamadı');im.src=r.result};r.readAsDataURL(f)}
eylem('gyFotoSec',(d,el)=>{const pen=el.closest('.pen');const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;gyResimKucult(f,520,url=>{const g=pen&&pen.querySelector('input[name=img]');if(g)g.value=url;const b=pen&&pen.querySelector('.gy-fsb');if(b)b.innerHTML=`<img src="${url}" alt="">`})};i.click()});
eylem('gyFotoSil',(d,el)=>{const pen=el.closest('.pen');const g=pen&&pen.querySelector('input[name=img]');if(g)g.value='';const b=pen&&pen.querySelector('.gy-fsb');if(b)b.innerHTML=`<span>${ik('camera')}<b>Fotoğraf ekle</b><small>İsteğe bağlı · küçültülüp telefonda saklanır</small></span>`;el.remove()});

 perde(`<div class="pb"><h2>${esc(x.t)}</h2><button class="ib2" data-kapat aria-label="Kapat">${ik('close')}</button></div><ol class="gy-adim">${(x.s||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${x.u?ui.not(esc(x.u),{uyari:1}):''}`,{renk:GY_RENK})});

bugunKart({ad:'giysem',sira:25,f:()=>{const K=gyGununKombini();if(!K)return '';const h=K.hava;
 const uy=h.yagmur?['umbrella','Şemsiye al']:/soğuk/i.test(h.bant)?['hanger','Mont giy']:null;

niyetKaydet({ad:'giysem',re:/giy|kıyafet|kombin|düğün|nişan|davet|görüşme|mülakat|yağmur|şemsiye|valiz|bavul|leke|ütü|çamaşır|ne üstüme/,f:soz=>{const s=trAlt(soz);const G=gyG();
 let o=null,t='gun',v='',bas_='Ne giysem?';
 if(/düğün|nişan|davet|kına|özel gün|parti/.test(s)){o='ozel';bas_='Davete ne giysem?'}else if(/görüşme|mülakat|toplantı|iş|ofis/.test(s)){o='is';bas_='İşe ne giysem?'}else if(/okul/.test(s)){o='okul'}else if(/spor|koşu|yürüyüş|spor salon/.test(s)){o='spor'}
 if(/leke|ütü|çamaşır|yıka/.test(s)){t='bakim';bas_='Kıyafet bakımı'}if(/valiz|bavul|tatil/.test(s)){v='valiz';bas_='Valiz hazırla'}
 if(/yağmur|şemsiye/.test(s)&&!o)bas_='Yağmurlu havaya ne giysem?';
 let oo=o||gyOrtamAl(G);if(G.kisi==='cocuk'&&oo==='is')oo='okul';const tst=!!G.tst&&G.kisi==='kadin';const parca=gyGenel(G.kisi,oo,gyHava(),tst,0);
 const hv=gyHava();const L=[];
 if(t==='bakim')L.push({baslik:'Leke ve çamaşır rehberi',alt:'Leke çıkarma, yıkama ve ütü bilgileri',ikon:'drop',renk:GY_RENK,a:'gyGit',data:{t:'bakim'}});
 else if(v)L.push({baslik:'Valiz listesi',alt:'Gün sayısına ve havaya göre hazır liste',ikon:'bag',renk:GY_RENK,a:'gyGit',data:{v:'valiz'}});
 else{L.push({baslik:gyOrtamAd(oo)+' için kombin · '+hv.t+'°',alt:parca.filter(p=>p.ikon!=='umbrella').slice(0,4).map(p=>p.ad).join(', '),ikon:'shirt',renk:GY_RENK,a:'gyGit',data:{o:oo}});

 L.push({baslik:'Gardırobum',alt:G.gard.length?G.gard.length+' parça · kombinler dolabından':'Kıyafetlerini ekle, dolabından kombin çıksın',ikon:'hanger',renk:GY_RENK,a:'gyGit',data:{t:'gard'}});
